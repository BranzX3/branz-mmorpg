name: apply-physical-authority-roadmap
on:
  push:
    branches:
      - agent/physical-gameplay-authority-final
    paths:
      - scripts/apply_physical_authority_roadmap.py
      - .github/workflows/apply-physical-authority-roadmap.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-gameplay-authority-final
      - name: Apply bounded roadmap patch
        run: python scripts/apply_physical_authority_roadmap.py
      - name: Remove temporary patch tooling
        run: |
          git rm scripts/apply_physical_authority_roadmap.py .github/workflows/apply-physical-authority-roadmap.yml
      - name: Commit roadmap contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/39-implementation-roadmap.md
          git commit -m "Prioritize physical gameplay authority refactor"
          git push origin HEAD:agent/physical-gameplay-authority-final
