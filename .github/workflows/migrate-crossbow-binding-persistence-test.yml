name: migrate-crossbow-binding-persistence-test
on:
  push:
    branches:
      - agent/physical-melee-weapon-bridge
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-melee-weapon-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Migrate persistence test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mmo-persistence/src/test/java/com/branz/mmorpg/persistence/transaction/JdbcValueTransactionServiceIntegrationTest.java')
          text = path.read_text()
          old = "        ValueLocation mainHand = ValueLocation.nativeEquipped(\"MAIN_HAND\");\n        ValueLocation quiver = ValueLocation.quiver(quiverId);\n        grantItem(crossbowId, mainHand);\n        grantLot(boltLotId, quiver, 2);\n"
          new = "        ValueLocation physicalCrossbow = ValueLocation.inventory(\"slot:3\");\n        ValueLocation quiver = ValueLocation.quiver(quiverId);\n        grantItem(crossbowId, physicalCrossbow);\n        grantLot(boltLotId, quiver, 2);\n"
          if text.count(old) != 1:
              raise SystemExit(f'crossbow fixture expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = 'void crossbowBoltBindingCommitsItemCheckpointAndQuiverConsumptionExactlyOnce()'
          before, after = text.split(marker, 1)
          old_update = "                                Optional.of(CHARACTER),\n                                mainHand,\n                                \"{}\",\n                                placedPayload),\n"
          new_update = "                                Optional.of(CHARACTER),\n                                physicalCrossbow,\n                                \"{}\",\n                                placedPayload),\n"
          if old_update not in after:
              raise SystemExit('crossbow payload update location block not found')
          after = after.replace(old_update, new_update, 1)
          text = before + marker + after
          needle = "        assertTrue(crossbow.payloadJson().contains(\"BOLT_PLACED\"));\n        assertEquals(2, crossbow.version());\n"
          replacement = "        assertTrue(crossbow.payloadJson().contains(\"BOLT_PLACED\"));\n        assertEquals(physicalCrossbow, crossbow.location());\n        assertEquals(2, crossbow.version());\n"
          if text.count(needle) != 1:
              raise SystemExit('crossbow result assertion block not found exactly once')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          ./gradlew :mmo-persistence:spotlessApply
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/migrate-crossbow-binding-persistence-test.yml
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Test Crossbow binding from physical inventory'
          git push origin HEAD:agent/physical-melee-weapon-bridge
