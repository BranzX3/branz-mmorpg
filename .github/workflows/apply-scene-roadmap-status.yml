name: apply-scene-roadmap-status

on:
  push:
    branches:
      - docs/scene-automated-verified

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/scene-automated-verified
      - name: Apply roadmap status
        run: python .github/apply-scene-roadmap-status.py
      - name: Commit roadmap status
        run: |
          rm .github/apply-scene-roadmap-status.py
          rm .github/workflows/apply-scene-roadmap-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mark Local Character Scene automated verified"
          git push origin HEAD:docs/scene-automated-verified
