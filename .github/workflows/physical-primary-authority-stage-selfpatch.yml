name: physical-primary-authority-stage-diagnostic

on:
  push:
    branches:
      - acceptance/physical-primary-authority-stage-v1

permissions:
  contents: write

jobs:
  diagnose-client:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture client compile
        id: client_compile
        continue-on-error: true
        shell: bash
        working-directory: acceptance/physical-client-26.2
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain compileGameTestJava 2>&1 | tee ../../client-compile-diagnostic.txt
      - name: Persist diagnostic
        if: steps.client_compile.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f client-compile-diagnostic.txt
          git commit -m 'debug: capture primary client compile output'
          git push origin HEAD:${GITHUB_REF_NAME}
          exit 1
