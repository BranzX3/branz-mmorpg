name: apply-physical-inventory-adapter-wiring
on:
  push:
    branches:
      - agent/physical-inventory-paper-adapter
    paths:
      - scripts/apply_physical_inventory_adapter_wiring.py
      - .github/workflows/apply-physical-inventory-adapter-wiring.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-inventory-paper-adapter
      - name: Apply bounded composition-root patch
        run: python scripts/apply_physical_inventory_adapter_wiring.py
      - name: Remove temporary patch tooling
        run: |
          git rm scripts/apply_physical_inventory_adapter_wiring.py .github/workflows/apply-physical-inventory-adapter-wiring.yml
      - name: Commit adapter wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java
          git commit -m "Wire physical inventory interaction adapter"
          git push origin HEAD:agent/physical-inventory-paper-adapter
