name: apply-inventory-action-policy-wiring
on:
  push:
    branches:
      - agent/physical-inventory-paper-adapter
    paths:
      - scripts/apply_inventory_action_policy_wiring.py
      - .github/workflows/apply-inventory-action-policy-wiring.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-inventory-paper-adapter
      - name: Apply action policy wiring
        run: python scripts/apply_inventory_action_policy_wiring.py
      - name: Remove temporary patch tooling
        run: |
          git rm scripts/apply_inventory_action_policy_wiring.py .github/workflows/apply-inventory-action-policy-wiring.yml
      - name: Commit policy wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/PhysicalInventoryInteractionController.java
          git commit -m "Use physical inventory action policy"
          git push origin HEAD:agent/physical-inventory-paper-adapter
