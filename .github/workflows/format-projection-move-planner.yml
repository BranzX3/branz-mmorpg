name: format-projection-move-planner
on:
  push:
    branches:
      - agent/inventory-projection-move-planner
    paths:
      - .github/workflows/format-projection-move-planner.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inventory-projection-move-planner
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Format mmo-items
        run: ./gradlew :mmo-items:spotlessApply
      - name: Remove temporary workflow and commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-projection-move-planner.yml
          git add mmo-items/src/main/java/com/branz/mmorpg/items/projection mmo-items/src/test/java/com/branz/mmorpg/items/projection
          git commit -m "Format projection move planner"
          git push origin HEAD:agent/inventory-projection-move-planner
