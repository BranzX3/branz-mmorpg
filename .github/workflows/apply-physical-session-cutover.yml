name: apply-physical-session-cutover
on:
  push:
    branches: [agent/physical-melee-weapon-bridge]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-melee-weapon-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Patch session authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java')
          text = path.read_text()
          text = replace_once(
              text,
              '''    private final CharacterSessionService sessions;\n    private final BukkitInventoryProjectionService projections;\n    private final ItemEngine itemEngine;\n''',
              '''    private final CharacterSessionService sessions;\n    private final BukkitInventoryProjectionService projections;\n    private final BukkitPhysicalItemResolver physicalItems;\n    private final LegacyMainHandMigrationService legacyMainHandMigration;\n    private final String contentVersion;\n    private final ItemEngine itemEngine;\n''',
              'session fields')
          text = replace_once(
              text,
              '''    CharacterSessionController(\n            JavaPlugin plugin,\n            CharacterSessionService sessions,\n            BukkitInventoryProjectionService projections,\n            ItemEngine itemEngine,\n            DatabaseSettings databaseSettings) {\n        this.plugin = Objects.requireNonNull(plugin, "plugin");\n        this.sessions = Objects.requireNonNull(sessions, "sessions");\n        this.projections = Objects.requireNonNull(projections, "projections");\n        this.itemEngine = Objects.requireNonNull(itemEngine, "itemEngine");\n''',
              '''    CharacterSessionController(\n            JavaPlugin plugin,\n            CharacterSessionService sessions,\n            BukkitInventoryProjectionService projections,\n            BukkitPhysicalItemResolver physicalItems,\n            LegacyMainHandMigrationService legacyMainHandMigration,\n            String contentVersion,\n            ItemEngine itemEngine,\n            DatabaseSettings databaseSettings) {\n        this.plugin = Objects.requireNonNull(plugin, "plugin");\n        this.sessions = Objects.requireNonNull(sessions, "sessions");\n        this.projections = Objects.requireNonNull(projections, "projections");\n        this.physicalItems = Objects.requireNonNull(physicalItems, "physicalItems");\n        this.legacyMainHandMigration =\n                Objects.requireNonNull(legacyMainHandMigration, "legacyMainHandMigration");\n        this.contentVersion = Objects.requireNonNull(contentVersion, "contentVersion");\n        this.itemEngine = Objects.requireNonNull(itemEngine, "itemEngine");\n''',
              'session constructor')
          text = replace_once(
              text,
              '''    Optional<LoadedCharacterSession> active(Player player) {\n        return Optional.ofNullable(\n                active.get(Objects.requireNonNull(player, "player").getUniqueId()));\n    }\n\n''',
              '''    Optional<LoadedCharacterSession> active(Player player) {\n        return Optional.ofNullable(\n                active.get(Objects.requireNonNull(player, "player").getUniqueId()));\n    }\n\n    Optional<ResolvedPhysicalItem> selectedPhysicalItem(Player player) {\n        Objects.requireNonNull(player, "player");\n        LoadedCharacterSession session = active.get(player.getUniqueId());\n        if (session == null || !ready(player)) {\n            return Optional.empty();\n        }\n        Result<ResolvedPhysicalItem, PhysicalItemResolutionErrorCode> resolved =\n                physicalItems.resolveSelected(player, session);\n        return resolved instanceof Result.Success<ResolvedPhysicalItem, PhysicalItemResolutionErrorCode>\n                        success\n                ? Optional.of(success.value())\n                : Optional.empty();\n    }\n\n    Optional<ResolvedPhysicalItem> physicalItemAt(Player player, int slot) {\n        Objects.requireNonNull(player, "player");\n        LoadedCharacterSession session = active.get(player.getUniqueId());\n        if (session == null || !ready(player)) {\n            return Optional.empty();\n        }\n        Result<ResolvedPhysicalItem, PhysicalItemResolutionErrorCode> resolved =\n                physicalItems.resolveSlot(player, session, slot);\n        return resolved instanceof Result.Success<ResolvedPhysicalItem, PhysicalItemResolutionErrorCode>\n                        success\n                ? Optional.of(success.value())\n                : Optional.empty();\n    }\n\n''',
              'physical item accessors')
          text = replace_once(
              text,
              '                                    sessions.open(playerId);',
              '                                    openAndMigrate(playerId);',
              'load migration call')
          text = replace_once(
              text,
              '''    private void completeLoad(\n''',
              '''    private Result<LoadedCharacterSession, CharacterSessionErrorCode> openAndMigrate(\n            UUID playerId) {\n        Result<LoadedCharacterSession, CharacterSessionErrorCode> opened = sessions.open(playerId);\n        if (opened instanceof Result.Failure<LoadedCharacterSession, CharacterSessionErrorCode>) {\n            return opened;\n        }\n        LoadedCharacterSession session =\n                ((Result.Success<LoadedCharacterSession, CharacterSessionErrorCode>) opened).value();\n        Result<LoadedCharacterSession, CharacterSessionErrorCode> migrated =\n                legacyMainHandMigration.migrate(session, contentVersion);\n        if (migrated instanceof Result.Failure<LoadedCharacterSession, CharacterSessionErrorCode>) {\n            sessions.close(session);\n        }\n        return migrated;\n    }\n\n    private void completeLoad(\n''',
              'openAndMigrate helper')
          path.write_text(text)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java')
          text = path.read_text()
          text = replace_once(
              text,
              '''        CharacterSessionService characterSessionService =\n                new CharacterSessionService(databaseRuntime, activeBuildEngine.get());\n        BukkitInventoryProjectionService inventoryProjectionService =\n                new BukkitInventoryProjectionService(projectionCodec);\n        characterSessionController =\n                new CharacterSessionController(\n                        this,\n                        characterSessionService,\n                        inventoryProjectionService,\n                        activeItemEngine.get(),\n                        databaseRuntime.settings());\n''',
              '''        CharacterSessionService characterSessionService =\n                new CharacterSessionService(databaseRuntime, activeBuildEngine.get());\n        BukkitInventoryProjectionService inventoryProjectionService =\n                new BukkitInventoryProjectionService(projectionCodec);\n        BukkitPhysicalItemResolver physicalItemResolver =\n                new BukkitPhysicalItemResolver(projectionCodec, activeItemEngine.get());\n        LegacyMainHandMigrationService legacyMainHandMigration =\n                new LegacyMainHandMigrationService(databaseRuntime, characterSessionService);\n        characterSessionController =\n                new CharacterSessionController(\n                        this,\n                        characterSessionService,\n                        inventoryProjectionService,\n                        physicalItemResolver,\n                        legacyMainHandMigration,\n                        snapshot.manifest().contentVersion(),\n                        activeItemEngine.get(),\n                        databaseRuntime.settings());\n''',
              'composition root session wiring')
          path.write_text(text)
          PY
          ./gradlew :mmo-bootstrap:spotlessApply
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-physical-session-cutover.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java .github/workflows/apply-physical-session-cutover.yml
          git commit -m "Migrate legacy main hand before physical projection"
          git push origin HEAD:agent/physical-melee-weapon-bridge
