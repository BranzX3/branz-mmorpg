name: physical-hotbar-reconnect-runtime-slots-selfpatch

on:
  push:
    branches:
      - fix/physical-hotbar-reconnect-runtime-slots

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply reconnect runtime-slot patch
        run: python .mmorpg-harness/tmp_hotbar_reconnect_runtime_slots_patch.py
      - name: Validate standalone physical client
        working-directory: acceptance/physical-client-26.2
        run: ./gradlew --no-daemon --console=plain build
      - name: Validate repository
        run: ./gradlew --no-daemon --console=plain clean build
      - name: Commit bounded client acceptance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acceptance/physical-client-26.2/src/gametest/java/com/branz/mmorpg/acceptance/PhysicalAuthorityClientGameTest.java
          git diff --cached --quiet && exit 0
          git commit -m "fix: tolerate runtime-owned hotbar representations after reconnect"
          git push origin HEAD:fix/physical-hotbar-reconnect-runtime-slots
