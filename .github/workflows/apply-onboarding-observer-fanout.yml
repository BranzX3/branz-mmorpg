name: apply-onboarding-observer-fanout

on:
  push:
    branches: [feature/playable-onboarding-first-combat-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose teaching and onboarding acceptance observers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java")
          text = path.read_text(encoding="utf-8")
          old = """        combatSessionController.setDamageImmunityObserver(downedController::protectedFromDamage);\n        combatSessionController.setHostileActionObserver(downedController::observeHostileAction);\n        combatSessionController.setSuccessfulActionObserver(\n                liveTeachingSessionController::observeSuccessfulAction);\n        ChronicleController chronicleController =\n                new ChronicleController(this, chronicle, characterSessionController::ready);\n        startingFoundationController =\n                new StartingFoundationController(\n                        this, characterSessionController, snapshot.manifest().contentVersion());\n        OnboardingClientAcceptanceProbe.install(\n                this,\n                startingFoundationController,\n                characterSessionController,\n                combatSessionController);\n"""
          new = """        combatSessionController.setDamageImmunityObserver(downedController::protectedFromDamage);\n        combatSessionController.setHostileActionObserver(downedController::observeHostileAction);\n        ChronicleController chronicleController =\n                new ChronicleController(this, chronicle, characterSessionController::ready);\n        startingFoundationController =\n                new StartingFoundationController(\n                        this, characterSessionController, snapshot.manifest().contentVersion());\n        SuccessfulCombatActionObserver onboardingAcceptanceObserver =\n                OnboardingClientAcceptanceProbe.install(\n                        this, startingFoundationController, characterSessionController);\n        combatSessionController.setSuccessfulActionObserver(\n                (actorId, actionId, moveId, currentTick) -> {\n                    liveTeachingSessionController.observeSuccessfulAction(\n                            actorId, actionId, moveId, currentTick);\n                    onboardingAcceptanceObserver.observe(\n                            actorId, actionId, moveId, currentTick);\n                });\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one observer/install composition block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Format and verify wiring
        run: |
          bash ./gradlew :mmo-bootstrap:spotlessApply :mmo-bootstrap:compileJava --no-daemon --console=plain
          git diff --check

      - name: Commit wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-onboarding-observer-fanout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java
          git commit -m "test(onboarding): compose combat acceptance observer"
          git push origin HEAD:feature/playable-onboarding-first-combat-v1
