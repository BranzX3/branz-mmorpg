name: build

on:
  push:
    branches: [feature/playable-onboarding-foundation-v1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playable-onboarding-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply guarded onboarding runtime wiring
        run: python3 .github/scripts/playable-onboarding-foundation-v1.py
      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply
      - name: Restore permanent CI and remove staging helper
        shell: bash
        run: |
          set -euo pipefail
          git show d745513ccf9901a9139739e5948314b1da58abae:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f .github/scripts/playable-onboarding-foundation-v1.py
          git diff --check
      - name: Prove onboarding persistence integration
        run: bash ./gradlew :mmo-persistence:test --tests '*JdbcCharacterOnboardingStateRepositoryIntegrationTest' --no-daemon --console=plain
      - name: Verify full repository
        run: bash ./gradlew clean build --no-daemon --console=plain
      - name: Commit verified foundation slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(onboarding): add crash-safe starter foundation flow'
          git push origin HEAD:feature/playable-onboarding-foundation-v1
