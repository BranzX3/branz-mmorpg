name: playable-v1 Paper combat acceptance

on:
  push:
    branches: [playable-v1]
    paths:
      - '.github/workflows/playable-v1-paper-combat-acceptance.yml'

permissions:
  contents: write

jobs:
  patch-build-paper-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playable-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply guarded Paper acceptance wiring
        run: python3 .github/scripts/playable-v1-paper-combat-acceptance.py
      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply
      - name: Clean staging helpers
        shell: bash
        run: |
          rm -f .github/scripts/playable-v1-paper-combat-acceptance.py
          rm -f .github/workflows/playable-v1-paper-combat-acceptance.yml
          git diff --check
      - name: Verify full repository
        run: bash ./gradlew clean build
      - name: Run Paper combat runtime acceptance
        shell: bash
        run: |
          mkdir -p mmo-bootstrap/run
          printf 'eula=true\n' > mmo-bootstrap/run/eula.txt
          bash ./gradlew :mmo-bootstrap:runServer -PcombatAcceptance=true --no-daemon --console=plain
      - name: Commit verified Paper acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(combat): add Paper runtime melee acceptance'
          git push origin HEAD:playable-v1
