name: directional-buffer-real-client

on:
  push:
    branches: [feature/playable-onboarding-directional-buffer-v1]

permissions:
  contents: read

jobs:
  exact-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup standalone Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Verify full repository
        run: bash ./gradlew clean build --no-daemon --console=plain

      - name: Compile exact 26.2 client gametest
        run: gradle -p acceptance/onboarding-client-26.2 compileGametestJava processGametestResources --no-daemon --console=plain

      - name: Run real Minecraft 26.2 directional buffer acceptance
        shell: bash
        run: |
          set -uo pipefail
          rm -rf mmo-bootstrap/run
          mkdir -p mmo-bootstrap/run
          printf 'eula=true\n' > mmo-bootstrap/run/eula.txt
          cat > mmo-bootstrap/run/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          spawn-protection=0
          max-players=1
          EOF
          rm -f mmo-bootstrap/build/directional-buffer-client-acceptance.pass
          bash ./gradlew :mmo-bootstrap:runServer -PdirectionalBufferAcceptance=true --no-daemon --console=plain > directional-paper.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 180); do
            if grep -q 'Done (' directional-paper.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Paper did not become ready.'
            cat directional-paper.log || true
            wait "$SERVER_PID" || true
            exit 1
          fi

          set +e
          xvfb-run -a gradle -p acceptance/onboarding-client-26.2 runClientGameTest -PacceptanceMode=directional-buffer --no-daemon --console=plain > directional-client.log 2>&1
          CLIENT_RC=$?
          set -e

          for _ in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          SERVER_RC=0
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo 'Paper did not shut down after directional buffer acceptance.'
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" || true
            SERVER_RC=1
          else
            wait "$SERVER_PID" || SERVER_RC=$?
          fi

          echo '===== CLIENT LOG ====='
          cat directional-client.log || true
          echo '===== PAPER LOG ====='
          cat directional-paper.log || true

          test "$CLIENT_RC" -eq 0
          test "$SERVER_RC" -eq 0
          test -f mmo-bootstrap/build/directional-buffer-client-acceptance.pass
          test "$(tr -d '\r\n' < mmo-bootstrap/build/directional-buffer-client-acceptance.pass)" = 'DIRECTIONAL_BUFFER_CLIENT_ACCEPTANCE_PASS'
          grep -q 'DIRECTIONAL_BUFFER_CLIENT_ACCEPTANCE_FIRST_READY' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_CLIENT_ACCEPTANCE_RECONNECT_READY' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_FORWARD_ROUTE_PASS' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_QUEUE_WINDOW_ARMED' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_ONE_SLOT_BUFFERED_PASS' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_FORWARD_MOVE_PASS' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_CLIENT_ACCEPTANCE_PASS move=move.training_greatsword.followup_crosscut routeStages=2' directional-paper.log
          grep -q 'DIRECTIONAL_BUFFER_STARTER_WEAPON_SELECTED_CLIENT' directional-client.log
          grep -q 'DIRECTIONAL_BUFFER_FORWARD_PRIMARY_INPUT_CLIENT' directional-client.log
          grep -q 'DIRECTIONAL_BUFFER_QUEUE_WINDOW_ARMED_CLIENT' directional-client.log
          grep -q 'DIRECTIONAL_BUFFER_FOLLOWUP_BUFFER_INPUT_CLIENT' directional-client.log
          echo 'DIRECTIONAL_BUFFER_REAL_CLIENT_GATE_PASS'
