name: onboarding-chronicle-scene-acceptance

on:
  push:
    branches: [feature/playable-onboarding-chronicle-scene-v1]

permissions:
  contents: read

jobs:
  exact-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup standalone Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Instrument Chronicle interaction diagnostic in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/SceneHubController.java")
          text = path.read_text(encoding="utf-8")

          old_header = """    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)\n    public void onChronicleUse(PlayerInteractEvent event) {\n        if (event.getHand() != org.bukkit.inventory.EquipmentSlot.HAND\n"""
          new_header = """    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n    public void onChronicleUse(PlayerInteractEvent event) {\n        plugin.getLogger()\n                .info(\n                        \"ONBOARDING_CHRONICLE_INTERACT_SERVER action=\"\n                                + event.getAction()\n                                + \" hand=\"\n                                + event.getHand()\n                                + \" item=\"\n                                + (event.getItem() == null ? \"null\" : event.getItem().getType())\n                                + \" cancelled=\"\n                                + event.isCancelled());\n        if (event.getHand() != org.bukkit.inventory.EquipmentSlot.HAND\n"""
          if text.count(old_header) != 1:
              raise SystemExit(f"expected one Chronicle handler header, found {text.count(old_header)}")
          text = text.replace(old_header, new_header)

          old_open = """        event.setCancelled(true);\n        open(event.getPlayer());\n"""
          new_open = """        event.setCancelled(true);\n        plugin.getLogger()\n                .info(\n                        \"ONBOARDING_CHRONICLE_RMB_SERVER action=\"\n                                + event.getAction()\n                                + \" hand=\"\n                                + event.getHand()\n                                + \" item=\"\n                                + event.getItem().getType());\n        Result<SceneSession, SceneErrorCode> onboardingAcceptanceOpen = open(event.getPlayer());\n        if (onboardingAcceptanceOpen\n                instanceof Result.Failure<SceneSession, SceneErrorCode> failure) {\n            plugin.getLogger()\n                    .info(\n                            \"ONBOARDING_CHRONICLE_SCENE_SERVER_FAIL error=\"\n                                    + failure.error().code()\n                                    + \" detail=\"\n                                    + failure.detail());\n        } else {\n            plugin.getLogger().info(\"ONBOARDING_CHRONICLE_SCENE_SERVER_SUCCESS\");\n        }\n"""
          if text.count(old_open) != 1:
              raise SystemExit(f"expected one Chronicle open call, found {text.count(old_open)}")
          path.write_text(text.replace(old_open, new_open), encoding="utf-8")
          PY

      - name: Compile runner diagnostic plugin
        run: bash ./gradlew :mmo-bootstrap:compileJava --no-daemon --console=plain

      - name: Compile exact 26.2 onboarding client gametest
        run: gradle -p acceptance/onboarding-client-26.2 compileGametestJava processGametestResources --no-daemon --console=plain

      - name: Run real Minecraft 26.2 Chronicle Scene acceptance
        shell: bash
        run: |
          set -uo pipefail
          rm -rf mmo-bootstrap/run
          mkdir -p mmo-bootstrap/run
          printf 'eula=true\n' > mmo-bootstrap/run/eula.txt
          cat > mmo-bootstrap/run/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          spawn-protection=0
          max-players=1
          EOF
          rm -f mmo-bootstrap/build/onboarding-client-acceptance.pass
          bash ./gradlew :mmo-bootstrap:runServer -PonboardingAcceptance=true --no-daemon --console=plain > onboarding-paper.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 180); do
            if grep -q 'Done (' onboarding-paper.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Paper did not become ready.'
            cat onboarding-paper.log || true
            wait "$SERVER_PID" || true
            exit 1
          fi

          set +e
          xvfb-run -a gradle -p acceptance/onboarding-client-26.2 runClientGameTest --no-daemon --console=plain > onboarding-client.log 2>&1
          CLIENT_RC=$?
          set -e

          for _ in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          SERVER_RC=0
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo 'Paper did not shut down after onboarding acceptance; terminating failed run.'
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" || true
            SERVER_RC=1
          else
            wait "$SERVER_PID" || SERVER_RC=$?
          fi

          echo '===== CLIENT LOG ====='
          cat onboarding-client.log || true
          echo '===== PAPER LOG ====='
          cat onboarding-paper.log || true

          test "$CLIENT_RC" -eq 0
          test "$SERVER_RC" -eq 0
          test -f mmo-bootstrap/build/onboarding-client-acceptance.pass
          test "$(tr -d '\r\n' < mmo-bootstrap/build/onboarding-client-acceptance.pass)" = 'ONBOARDING_CLIENT_ACCEPTANCE_PASS'
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_FIRST_READY' onboarding-paper.log
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_RECONNECT_READY' onboarding-paper.log
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_PASS' onboarding-paper.log
          grep -q 'ONBOARDING_CHRONICLE_SCENE_CLIENT_PASS' onboarding-client.log
