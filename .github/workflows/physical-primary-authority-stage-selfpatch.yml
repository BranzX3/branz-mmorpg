name: physical-primary-authority-stage-validation

on:
  push:
    branches:
      - acceptance/physical-primary-authority-stage-v1

permissions:
  contents: read

jobs:
  validate-client:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate client acceptance harness
        shell: bash
        working-directory: acceptance/physical-client-26.2
        run: ./gradlew --no-daemon --console=plain build
