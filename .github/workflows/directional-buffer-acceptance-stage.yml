name: directional-buffer-acceptance-stage

on:
  push:
    branches: [feature/playable-onboarding-directional-buffer-v1]

permissions:
  contents: write

jobs:
  stage-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply guarded plugin patch
        run: python .github/scripts/directional-buffer-acceptance-plugin.py
      - name: Format and verify
        run: |
          bash ./gradlew :mmo-bootstrap:spotlessApply --no-daemon --console=plain
          bash ./gradlew clean build --no-daemon --console=plain
      - name: Commit verified acceptance wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java \
            mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/DirectionalBufferClientAcceptanceProbe.java
          git commit -m 'Wire directional buffer real-client acceptance'
          git push origin HEAD:feature/playable-onboarding-directional-buffer-v1
