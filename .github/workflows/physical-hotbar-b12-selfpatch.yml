name: physical-hotbar-b12-client-validate

on:
  push:
    branches:
      - acceptance/physical-hotbar-b12

jobs:
  validate-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate standalone physical client
        working-directory: acceptance/physical-client-26.2
        run: ./gradlew --no-daemon --console=plain build
