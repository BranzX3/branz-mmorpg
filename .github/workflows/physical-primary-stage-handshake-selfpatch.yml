name: physical-primary-stage-handshake-selfpatch

on:
  push:
    branches:
      - fix/physical-primary-stage-handshake

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Add projected-stage client handshake
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java')
          text = path.read_text(encoding='utf-8')
          old = '                                                                + acceptanceWeapon.id());\n                                    }));\n'
          new = '                                                                + acceptanceWeapon.id());\n                                        player.setLevel(8);\n                                    }));\n'
          if text.count(old) != 1:
              raise SystemExit(f'projected stage handshake anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate repository
        shell: bash
        run: ./gradlew clean build
      - name: Validate client acceptance harness
        shell: bash
        working-directory: acceptance/physical-client-26.2
        run: ./gradlew --no-daemon --console=plain build
      - name: Commit server handshake
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java
          test "$(git diff --cached --name-only)" = 'mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java'
          git commit -m 'fix: signal completed primary authority staging to client'
          git push origin HEAD:${GITHUB_REF_NAME}
