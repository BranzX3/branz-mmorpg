name: apply-shield-live-wiring

on:
  push:
    branches:
      - agent/shield-live-wear

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shield-live-wear
      - name: Apply live wiring
        run: python .github/apply-shield-live-wiring.py
      - name: Commit live wiring
        run: |
          rm .github/apply-shield-live-wiring.py
          rm .github/workflows/apply-shield-live-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire shield durability into live guard resolution"
          git push origin HEAD:agent/shield-live-wear
