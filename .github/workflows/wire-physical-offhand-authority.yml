name: wire-physical-offhand-authority
on:
  push:
    branches:
      - agent/physical-offhand-authority
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-offhand-authority
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Wire offhand and lock Chronicle native slots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java')
          text = path.read_text()
          marker = '        if (!valueMutationInFlight.add(player.getUniqueId())) {\n            completion.accept(valueMutationBusy());\n            return;\n        }\n'
          start = text.index('    void commitEquipment(')
          end = text.index('    void commitBuild(', start)
          block = text[start:end]
          if marker not in block:
              raise SystemExit('commitEquipment mutation marker not found')
          guard = '        boolean nativePhysicalChange =\n                java.util.stream.Stream.of(\n                                EquipmentSlot.MAIN_HAND,\n                                EquipmentSlot.OFF_HAND,\n                                EquipmentSlot.HEAD,\n                                EquipmentSlot.CHEST,\n                                EquipmentSlot.LEGS,\n                                EquipmentSlot.FEET)\n                        .anyMatch(\n                                slot ->\n                                        !session.snapshot()\n                                                .equipment()\n                                                .item(slot)\n                                                .equals(desired.item(slot)));\n        if (nativePhysicalChange) {\n            completion.accept(\n                    Result.failure(\n                            CharacterSessionErrorCode.CHARACTER_TRANSACTION_REJECTED,\n                            "Native weapon, shield and armor slots are physical gameplay authority and cannot be changed from Chronicle."));\n            return;\n        }\n'
          block = block.replace(marker, guard + marker, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java')
          text = path.read_text()
          text = once(text, '    private PhysicalInventoryInteractionController physicalInventoryInteractionController;\n', '    private PhysicalInventoryInteractionController physicalInventoryInteractionController;\n    private PhysicalOffHandInteractionController physicalOffHandInteractionController;\n', 'plugin field')
          create_marker = '        physicalInventoryInteractionController =\n                new PhysicalInventoryInteractionController(\n                        this,\n                        characterSessionController,\n                        projectionCodec,\n                        new PhysicalInventoryItemMoveService(\n                                databaseRuntime, characterSessionService),\n                        snapshot.manifest().contentVersion());\n'
          create_replacement = create_marker + '        physicalOffHandInteractionController =\n                new PhysicalOffHandInteractionController(\n                        this,\n                        characterSessionController,\n                        projectionCodec,\n                        activeItemEngine.get(),\n                        new PhysicalOffHandItemMoveService(databaseRuntime, characterSessionService),\n                        snapshot.manifest().contentVersion());\n'
          text = once(text, create_marker, create_replacement, 'offhand creation')
          text = once(text, '        getServer().getPluginManager().registerEvents(physicalInventoryInteractionController, this);\n        getServer().getPluginManager().registerEvents(combatSessionController, this);\n', '        getServer().getPluginManager().registerEvents(physicalInventoryInteractionController, this);\n        getServer().getPluginManager().registerEvents(physicalOffHandInteractionController, this);\n        getServer().getPluginManager().registerEvents(combatSessionController, this);\n', 'offhand registration')
          shutdown_marker = '        if (physicalInventoryInteractionController != null) {\n            physicalInventoryInteractionController.shutdown();\n            physicalInventoryInteractionController = null;\n        }\n'
          text = once(text, shutdown_marker, shutdown_marker + '        physicalOffHandInteractionController = null;\n', 'offhand shutdown')
          path.write_text(text)
          PY
          ./gradlew :mmo-bootstrap:spotlessApply
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/wire-physical-offhand-authority.yml
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire physical shield offhand authority'
          git push origin HEAD:agent/physical-offhand-authority
