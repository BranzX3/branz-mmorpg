name: hotbar-dynamic-slots-harness-selfpatch

on:
  push:
    branches:
      - harness-feature/physical-hotbar-dynamic-slots-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply dynamic-slot parser patch
        run: python .mmorpg-harness/tmp_hotbar_dynamic_slots_runner_patch.py
      - name: Validate harness
        run: |
          python -m py_compile .mmorpg-harness/runner.py .mmorpg-harness/selftest.py
          python .mmorpg-harness/selftest.py
      - name: Validate repository
        run: ./gradlew --no-daemon --console=plain clean build
      - name: Commit bounded control change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mmorpg-harness/runner.py .mmorpg-harness/selftest.py .mmorpg-harness/PROTOCOL.md
          git diff --cached --quiet && exit 0
          git commit -m "harness: accept dynamic physical hotbar destinations"
          git push origin HEAD:harness-feature/physical-hotbar-dynamic-slots-v1
