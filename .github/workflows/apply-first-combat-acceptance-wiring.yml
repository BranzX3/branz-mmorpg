name: apply-first-combat-acceptance-wiring

on:
  push:
    branches: [feature/playable-onboarding-first-combat-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Wire onboarding acceptance to combat observer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java")
          text = path.read_text(encoding="utf-8")
          old = """        OnboardingClientAcceptanceProbe.install(\n                this, startingFoundationController, characterSessionController);\n"""
          new = """        OnboardingClientAcceptanceProbe.install(\n                this,\n                startingFoundationController,\n                characterSessionController,\n                combatSessionController);\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one onboarding acceptance install call, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Compile acceptance wiring
        run: bash ./gradlew :mmo-bootstrap:compileJava --no-daemon --console=plain

      - name: Commit wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-first-combat-acceptance-wiring.yml
          test "$(git diff --name-only)" = "mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java"
          test "$(git diff --cached --name-only)" = ".github/workflows/apply-first-combat-acceptance-wiring.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java
          git commit -m "test(onboarding): observe first committed combat action"
          git push origin HEAD:feature/playable-onboarding-first-combat-v1
