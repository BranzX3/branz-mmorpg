name: playable-v1 melee feedback patch

on:
  push:
    branches: [playable-v1]
    paths:
      - '.github/workflows/playable-v1-melee-feedback-patch.yml'

permissions:
  contents: write

jobs:
  patch-format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playable-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply guarded adapter patch
        run: python3 .github/scripts/playable-v1-melee-feedback.py
      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply
      - name: Clean staging helpers
        shell: bash
        run: |
          rm -f .github/scripts/playable-v1-melee-feedback.py
          rm -f .github/workflows/playable-v1-melee-feedback-patch.yml
          git diff --check
      - name: Verify full repository
        run: bash ./gradlew clean build
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(combat): add authoritative melee hit feedback'
          git push origin HEAD:playable-v1
