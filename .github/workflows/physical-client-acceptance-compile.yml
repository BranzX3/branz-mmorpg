name: physical-client-acceptance-compile

on:
  push:
    branches:
      - lead/physical-client-acceptance-harness-v1
  pull_request:
    paths:
      - 'acceptance/physical-client-26.2/**'
      - '.github/workflows/physical-client-acceptance-compile.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup isolated Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
      - name: Generate pinned client wrapper
        shell: bash
        run: |
          gradle -p acceptance/physical-client-26.2 wrapper --gradle-version 9.5.0 --distribution-type bin
          checksum="$(curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip.sha256 | tr -d '\r\n')"
          test "${#checksum}" -eq 64
          if ! grep -q '^distributionSha256Sum=' acceptance/physical-client-26.2/gradle/wrapper/gradle-wrapper.properties; then
            printf '\ndistributionSha256Sum=%s\n' "$checksum" >> acceptance/physical-client-26.2/gradle/wrapper/gradle-wrapper.properties
          fi
          test "$(sed -n 's/^distributionSha256Sum=//p' acceptance/physical-client-26.2/gradle/wrapper/gradle-wrapper.properties)" = "$checksum"
          chmod +x acceptance/physical-client-26.2/gradlew
      - name: Compile client acceptance harness through generated wrapper
        shell: bash
        working-directory: acceptance/physical-client-26.2
        run: ./gradlew --no-daemon --console=plain build
      - name: Commit generated wrapper once through Git data API
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'branz-physical-client-wrapper-commit',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          ref = request('GET', f'/repos/{repo}/git/ref/heads/{branch}')
          if ref['object']['sha'] != parent:
              raise SystemExit(
                  f'branch moved during wrapper generation: expected {parent}, got {ref["object"]["sha"]}'
              )

          commit = request('GET', f'/repos/{repo}/git/commits/{parent}')
          base_tree = commit['tree']['sha']
          entries = []
          files = [
              ('acceptance/physical-client-26.2/gradlew', '100755'),
              ('acceptance/physical-client-26.2/gradlew.bat', '100644'),
              ('acceptance/physical-client-26.2/gradle/wrapper/gradle-wrapper.jar', '100644'),
              ('acceptance/physical-client-26.2/gradle/wrapper/gradle-wrapper.properties', '100644'),
          ]
          for path, mode in files:
              raw = pathlib.Path(path).read_bytes()
              blob = request(
                  'POST',
                  f'/repos/{repo}/git/blobs',
                  {'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'},
              )
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})

          tree = request(
              'POST',
              f'/repos/{repo}/git/trees',
              {'base_tree': base_tree, 'tree': entries},
          )
          created = request(
              'POST',
              f'/repos/{repo}/git/commits',
              {
                  'message': 'test: check in pinned client Gradle wrapper',
                  'tree': tree['sha'],
                  'parents': [parent],
              },
          )
          request(
              'PATCH',
              f'/repos/{repo}/git/refs/heads/{branch}',
              {'sha': created['sha'], 'force': False},
          )
          print(f'WRAPPER_COMMIT={created["sha"]}')
          PY
