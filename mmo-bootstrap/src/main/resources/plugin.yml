name: BranzMMO
version: '${version}'
main: com.branz.mmorpg.bootstrap.BranzMmoPlugin
description: Server-authoritative MMO platform
api-version: '26.2'
load: STARTUP
authors: [Branz]
softdepend: [Oraxen, MythicMobs, packetevents, WorldGuard]
commands:
  mmo:
    description: Branz MMO status and local development tools
    usage: /mmo <health|dev|combat|progression|teaching|renown>
permissions:
  branzmmo.dev:
    description: Opens environment-gated MMO development tools
    default: op
