name: harness-hotbar-b12-selfpatch

on:
  push:
    branches:
      - harness-feature/physical-hotbar-b12-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply B1-B2 harness patch
        run: python .mmorpg-harness/tmp_hotbar_b12_runner_patch.py
      - name: Validate harness
        shell: bash
        run: |
          python -m py_compile .mmorpg-harness/runner.py .mmorpg-harness/selftest.py
          python .mmorpg-harness/selftest.py
      - name: Commit bounded harness patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .mmorpg-harness/runner.py .mmorpg-harness/PROTOCOL.md .mmorpg-harness/selftest.py
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'harness: add physical hotbar B1-B2 acceptance action'
          git push origin HEAD:${GITHUB_REF_NAME}
