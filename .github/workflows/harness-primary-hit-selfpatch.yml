name: harness-primary-hit-selfpatch

on:
  push:
    branches:
      - harness-feature/physical-primary-hit-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Harness self-patch: activate physical primary hit v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harness-feature/physical-primary-hit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded capability patch
        run: python .mmorpg-harness/patch_primary_hit_v1.py
      - name: Validate harness protocol
        run: |
          python -m py_compile .mmorpg-harness/runner.py .mmorpg-harness/selftest.py
          python .mmorpg-harness/selftest.py
      - name: Commit reviewed outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .mmorpg-harness/runner.py .mmorpg-harness/selftest.py .mmorpg-harness/PROTOCOL.md
          git diff --cached --quiet && exit 1
          git commit -m 'Harness: add physical primary hit v1 capability'
          git push origin HEAD:harness-feature/physical-primary-hit-v1
