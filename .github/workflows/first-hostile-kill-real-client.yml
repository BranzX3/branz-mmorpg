name: first-hostile-kill-real-client

on:
  push:
    branches: [feature/playable-onboarding-first-hostile-kill-v1]

permissions:
  contents: read

jobs:
  exact-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup standalone Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Verify full repository
        run: bash ./gradlew clean build --no-daemon --console=plain

      - name: Compile exact 26.2 client gametest
        run: gradle -p acceptance/onboarding-client-26.2 compileGametestJava processGametestResources --no-daemon --console=plain

      - name: Run real Minecraft 26.2 first hostile kill acceptance
        shell: bash
        run: |
          set -uo pipefail
          rm -rf mmo-bootstrap/run
          mkdir -p mmo-bootstrap/run
          printf 'eula=true\n' > mmo-bootstrap/run/eula.txt
          cat > mmo-bootstrap/run/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          spawn-protection=0
          max-players=1
          difficulty=normal
          EOF
          rm -f mmo-bootstrap/build/onboarding-client-acceptance.pass
          bash ./gradlew :mmo-bootstrap:runServer -PonboardingAcceptance=true -PonboardingAcceptanceMode=hostile-kill --no-daemon --console=plain > hostile-paper.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 180); do
            if grep -q 'Done (' hostile-paper.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Paper did not become ready.'
            cat hostile-paper.log || true
            wait "$SERVER_PID" || true
            exit 1
          fi

          set +e
          xvfb-run -a gradle -p acceptance/onboarding-client-26.2 runClientGameTest -PacceptanceMode=hostile-kill --no-daemon --console=plain > hostile-client.log 2>&1
          CLIENT_RC=$?
          set -e

          for _ in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          SERVER_RC=0
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo 'Paper did not shut down after first hostile kill acceptance.'
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" || true
            SERVER_RC=1
          else
            wait "$SERVER_PID" || SERVER_RC=$?
          fi

          echo '===== CLIENT LOG ====='
          cat hostile-client.log || true
          echo '===== PAPER LOG ====='
          cat hostile-paper.log || true

          test "$CLIENT_RC" -eq 0
          test "$SERVER_RC" -eq 0
          test -f mmo-bootstrap/build/onboarding-client-acceptance.pass
          test "$(tr -d '\r\n' < mmo-bootstrap/build/onboarding-client-acceptance.pass)" = 'ONBOARDING_CLIENT_ACCEPTANCE_PASS'
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_RECONNECT_READY' hostile-paper.log
          grep -q 'ONBOARDING_FIRST_COMBAT_GATE_PASS' hostile-paper.log
          grep -q 'ONBOARDING_DEFENSE_DODGE_GATE_PASS' hostile-paper.log
          grep -q 'ONBOARDING_FIRST_HOSTILE_KILL_TARGET_READY' hostile-paper.log
          grep -q 'ONBOARDING_HOSTILE_COMBAT_ACTION' hostile-paper.log
          grep -q 'ONBOARDING_FIRST_HOSTILE_KILL_GATE_PASS' hostile-paper.log
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_PASS hostileKill=true' hostile-paper.log
          grep -q 'ONBOARDING_CHRONICLE_SCENE_CLIENT_PASS' hostile-client.log
          grep -q 'ONBOARDING_DIRECTIONAL_DODGE_INPUT_CLIENT' hostile-client.log
          grep -q 'ONBOARDING_FIRST_HOSTILE_KILL_TARGET_READY_CLIENT' hostile-client.log
          grep -q 'ONBOARDING_HOSTILE_PRIMARY_INPUT_CLIENT attempt=' hostile-client.log
          echo 'FIRST_HOSTILE_KILL_REAL_CLIENT_GATE_PASS'
