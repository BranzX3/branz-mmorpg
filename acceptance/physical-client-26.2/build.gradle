plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'branz-physical-authority-client-acceptance'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaExec).configureEach {
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalPrimaryInputAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalPrimaryInput', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalPrimaryHitAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalPrimaryHit', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalPrimaryBrokenAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalPrimaryBroken', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalBrokenRestartAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalBrokenRestart', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalChronicleSlotAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalChronicleSlot', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalHotbarAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalHotbar', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalConsumableLotAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalConsumableLot', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalConsumableUseAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalConsumableUse', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalConsumableC4Acceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalConsumableC4', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalConsumableC4RestartAcceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalConsumableC4Restart', 'true'
    }
    if (name == 'runClientGameTest' && providers.gradleProperty('physicalShieldD13Acceptance').orNull == 'true') {
        systemProperty 'branz.acceptance.physicalShieldD13', 'true'
    }
}
