database:
  enabled: false
  host: localhost
  port: 3306
  name: branz_mmorpg
  username: branz
  password: change-me
  pool-size: 10
  connection-timeout-millis: 5000

content:
  directory: content

player-session:
  worker-threads: 2
  autosave-interval-ticks: 6000
  save-max-attempts: 3
  recovery-directory: recovery/player-profiles
  shutdown-timeout-millis: 5000

quest:
  directory: quest-content

core:
  # Threads for off-tick work (profile loads, saves).
  async-pool-size: 4

player:
  # What happens when a player logs in while a session for the same UUID is
  # still live, which usually means an unclean disconnect left a ghost.
  #   CLOSE_PREVIOUS - conflict the old session and let the new login proceed
  #   REJECT_NEW     - refuse the new login until the old session is reaped
  duplicate-login: CLOSE_PREVIOUS
  # Periodic save of dirty sessions. Minimum 30s.
  autosave-seconds: 300

combat:
  pvp-enabled: false
  friendly-fire: false
  pvp-coefficient: 0.5
  mitigation-constant: 100.0
  maximum-reduction: 0.85
  minimum-damage-fraction: 0.10
  timeout-millis: 6000

items:
  # Generated and persisted on first start. Changing it quarantines old tokens;
  # authoritative ownership remains safe and tokens are re-issued on reconcile.
  token-secret: ""
