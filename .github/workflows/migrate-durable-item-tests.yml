name: migrate-durable-item-tests
on:
  push:
    branches: [agent/physical-melee-weapon-bridge]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-melee-weapon-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Migrate tests to physical item truth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('mmo-bootstrap/src/test/java/com/branz/mmorpg/bootstrap/CharacterSessionServiceIntegrationTest.java')
          text = path.read_text()
          text = replace_once(
              text,
              '''            session =\n                    success(\n                            service.commitEquipment(\n                                    session,\n                                    session.snapshot()\n                                            .equipment()\n                                            .with(EquipmentSlot.MAIN_HAND, Optional.of(staffId)),\n                                    "content.test.1"));\n            LoadedCharacterSession beforeCommit = session;\n''',
              '''            assertEquals(\n                    ValueLocation.inventory("slot:0"),\n                    itemRecord(session, staffId).location());\n            LoadedCharacterSession beforeCommit = session;\n''',
              'catalyst physical fixture')
          text = replace_once(
              text,
              '''            session =\n                    success(\n                            service.commitEquipment(\n                                    session,\n                                    session.snapshot()\n                                            .equipment()\n                                            .with(EquipmentSlot.MAIN_HAND, Optional.of(crossbowId)),\n                                    "content.test.1"));\n            session = success(service.grantTestValue(session, boltQuiver, 1, "content.test.1"));\n''',
              '''            assertEquals(\n                    ValueLocation.inventory("slot:0"),\n                    itemRecord(session, crossbowId).location());\n            session = success(service.grantTestValue(session, boltQuiver, 1, "content.test.1"));\n''',
              'crossbow physical fixture')
          path.write_text(text)
          PY
          ./gradlew :mmo-bootstrap:spotlessApply
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/migrate-durable-item-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mmo-bootstrap/src/test/java/com/branz/mmorpg/bootstrap/CharacterSessionServiceIntegrationTest.java .github/workflows/migrate-durable-item-tests.yml
          git commit -m "Test crossbow and catalyst from physical inventory"
          git push origin HEAD:agent/physical-melee-weapon-bridge
