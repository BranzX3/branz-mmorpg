name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Harness self-test
        shell: bash
        run: |
          if [[ -f .mmorpg-harness/selftest.py ]]; then
            # Control PRs must self-test the candidate checkout as the
            # prospective reviewed control ref. This ref mutation exists only
            # inside the disposable GitHub Actions checkout.
            git update-ref refs/remotes/origin/HARNESS_MMORPG_CONTROL HEAD
            python .mmorpg-harness/selftest.py
            if [[ -f .mmorpg-harness/selftest_b7.py ]]; then
              python .mmorpg-harness/selftest_b7.py
            fi
          fi
      - name: Verify
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build
