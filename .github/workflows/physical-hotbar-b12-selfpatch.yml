name: physical-hotbar-b12-selfpatch

on:
  push:
    branches:
      - acceptance/physical-hotbar-b12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply B1-B2 patch
        run: python .mmorpg-harness/tmp_hotbar_b12_patch.py
      - name: Correct authoritative location verification
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/PhysicalInventoryInteractionController.java'); t=p.read_text(encoding='utf-8'); old='record.location()\\n                                                        .reference()\\n                                                        .equals(expectedReference)'; new='record.location()\\n                                                        .reference()\\n                                                        .filter(expectedReference::equals)\\n                                                        .isPresent()'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1),encoding='utf-8')"
      - name: Apply formatting
        run: ./gradlew spotlessApply
      - name: Validate repository
        run: ./gradlew clean build
      - name: Commit bounded server patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mmo-bootstrap/build.gradle.kts acceptance/physical-client-26.2/build.gradle mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/PhysicalInventoryInteractionController.java
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'acceptance: stage physical hotbar cursor authority'
          git push origin HEAD:${GITHUB_REF_NAME}
