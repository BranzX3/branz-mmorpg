name: playable-v1 hostile auto-draw patch

on:
  push:
    branches: [playable-v1]
    paths:
      - '.github/workflows/playable-v1-hostile-autodraw-patch.yml'

permissions:
  contents: write

jobs:
  patch-format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playable-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply guarded hostile auto-draw patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java')
          source = path.read_text(encoding='utf-8')

          import_needle = 'import com.branz.mmorpg.combat.input.InputRoutingContext;\n'
          if source.count(import_needle) != 1:
              raise SystemExit(f'import guard failed: {source.count(import_needle)}')
          source = source.replace(
              import_needle,
              import_needle + 'import com.branz.mmorpg.combat.input.HostileAutoDrawPolicy;\n',
              1,
          )

          incoming = '\n'.join([
              '        if (resolved.outcome() != CombatDefenseOutcome.DODGED) {',
              '            markHostile(defender, defenderSession);',
              '        }',
          ])
          incoming_replacement = '\n'.join([
              '        if (resolved.outcome() != CombatDefenseOutcome.DODGED) {',
              '            markIncomingHostile(defender, defenderSession);',
              '        }',
          ])
          incoming_count = source.count(incoming)
          if incoming_count != 2:
              raise SystemExit(f'incoming-hostile guard failed: expected 2, got {incoming_count}')
          source = source.replace(incoming, incoming_replacement)

          mark_hostile_marker = '    private void markHostile(Player player, LiveSession session) {'
          if source.count(mark_hostile_marker) != 1:
              raise SystemExit(f'markHostile marker guard failed: {source.count(mark_hostile_marker)}')
          helper = '\n'.join([
              '    private void markIncomingHostile(Player player, LiveSession session) {',
              '        markHostile(player, session);',
              '        SelectedHotbarSlot combatSlot = selectedSlot(player, 0);',
              '        boolean combatReady = combatReadinessFailure(player).isEmpty();',
              '        if (!HostileAutoDrawPolicy.shouldBeginDraw(',
              '                session.weapon.state(),',
              '                combatSlot.kind(),',
              '                combatReady,',
              '                session.health.dead())) {',
              '            return;',
              '        }',
              '        player.getInventory().setHeldItemSlot(combatSlot.slot());',
              '        select(session, combatSlot);',
              '    }',
              '',
          ])
          source = source.replace(mark_hostile_marker, helper + mark_hostile_marker, 1)
          path.write_text(source, encoding='utf-8')
          PY

          mkdir -p mmo-combat/src/main/java/com/branz/mmorpg/combat/input
          cat > mmo-combat/src/main/java/com/branz/mmorpg/combat/input/HostileAutoDrawPolicy.java <<'JAVA'
          package com.branz.mmorpg.combat.input;

          import com.branz.mmorpg.combat.state.WeaponState;
          import com.branz.mmorpg.combat.weapon.SelectedSlotKind;
          import java.util.Objects;

          /** Decides whether incoming hostile damage should select and draw the equipped weapon. */
          public final class HostileAutoDrawPolicy {
              private HostileAutoDrawPolicy() {}

              public static boolean shouldBeginDraw(
                      WeaponState weapon,
                      SelectedSlotKind equippedCombatSlot,
                      boolean combatReady,
                      boolean dead) {
                  Objects.requireNonNull(weapon, "weapon");
                  Objects.requireNonNull(equippedCombatSlot, "equippedCombatSlot");
                  return !dead
                          && combatReady
                          && equippedCombatSlot == SelectedSlotKind.COMBAT_WEAPON
                          && (weapon == WeaponState.SHEATHED || weapon == WeaponState.SHEATHING);
              }
          }
          JAVA

          mkdir -p mmo-combat/src/test/java/com/branz/mmorpg/combat/input
          cat > mmo-combat/src/test/java/com/branz/mmorpg/combat/input/HostileAutoDrawPolicyTest.java <<'JAVA'
          package com.branz.mmorpg.combat.input;

          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import com.branz.mmorpg.combat.state.WeaponState;
          import com.branz.mmorpg.combat.weapon.SelectedSlotKind;
          import org.junit.jupiter.api.Test;

          class HostileAutoDrawPolicyTest {
              @Test
              void sheathedReadyCombatWeaponDrawsOnIncomingHostility() {
                  assertTrue(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.SHEATHED,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  true,
                                  false));
              }

              @Test
              void sheathingWeaponCanReverseBackTowardCombatReadiness() {
                  assertTrue(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.SHEATHING,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  true,
                                  false));
              }

              @Test
              void alreadyDrawingReadyOrDisabledDoesNotRestartDraw() {
                  assertFalse(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.DRAWING,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  true,
                                  false));
                  assertFalse(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.READY,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  true,
                                  false));
                  assertFalse(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.DISABLED,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  true,
                                  false));
              }

              @Test
              void missingInvalidOrDeadWeaponStateNeverAutoDraws() {
                  assertFalse(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.SHEATHED,
                                  SelectedSlotKind.TOOL_OR_BLOCK,
                                  true,
                                  false));
                  assertFalse(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.SHEATHED,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  false,
                                  false));
                  assertFalse(
                          HostileAutoDrawPolicy.shouldBeginDraw(
                                  WeaponState.SHEATHED,
                                  SelectedSlotKind.COMBAT_WEAPON,
                                  true,
                                  true));
              }
          }
          JAVA

          rm -f .github/workflows/playable-v1-hostile-autodraw-patch.yml
          git diff --check

      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply

      - name: Verify formatted diff
        run: git diff --check

      - name: Verify full repository
        run: bash ./gradlew clean build

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(combat): auto-draw weapon on incoming hostility'
          git push origin HEAD:playable-v1
