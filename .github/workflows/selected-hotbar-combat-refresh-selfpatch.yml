name: selected-hotbar-combat-refresh-selfpatch

on:
  push:
    branches:
      - fix/selected-hotbar-combat-refresh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Wire selected-hotbar authority refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java')
          text = path.read_text(encoding='utf-8')
          old = "        Player player = plugin.getServer().getPlayer(playerId);\n        if (player != null && player.isOnline()) {\n            applyProjectionIfReady(player, false);\n            if (equipmentChanged && ready(player)) {\n                equipmentMutationHandlers.forEach(handler -> handler.accept(player));\n            }\n        }\n"
          new = "        Player player = plugin.getServer().getPlayer(playerId);\n        if (player != null && player.isOnline()) {\n            boolean selectedHotbarAuthorityChanged =\n                    SelectedHotbarAuthorityIdentity.changed(\n                            current.snapshot().itemRecords(),\n                            updated.snapshot().itemRecords(),\n                            player.getInventory().getHeldItemSlot());\n            applyProjectionIfReady(player, false);\n            if ((equipmentChanged || selectedHotbarAuthorityChanged) && ready(player)) {\n                equipmentMutationHandlers.forEach(handler -> handler.accept(player));\n            }\n        }\n"
          if text.count(old) != 1:
              raise SystemExit(f'completeSnapshotMutation anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build 2>&1 | tee selected-hotbar-build-diagnostic.txt
      - name: Persist failure diagnostic
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f selected-hotbar-build-diagnostic.txt
          git commit -m 'debug: capture selected-hotbar build failure'
          git push origin HEAD:${GITHUB_REF_NAME}
          exit 1
      - name: Commit bounded wiring
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java
          test "$(git diff --cached --name-only)" = 'mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java'
          git commit -m 'fix: refresh combat when selected hotbar authority changes'
          git push origin HEAD:${GITHUB_REF_NAME}
