name: apply-physical-combat-authority
on:
  push:
    branches: [agent/physical-melee-weapon-bridge]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-melee-weapon-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Patch physical combat authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return updated

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java')
          text = path.read_text()
          text = regex_once(
              text,
              r'''    Optional<ItemId> equippedMainHandItemId\(Player player\) \{.*?\n    \}\n\n    Optional<CrossbowPersistentState> equippedCrossbowState\(Player player\) \{.*?\n    \}\n\n    Optional<CatalystDurability> equippedCatalystDurability\(Player player, int baseMaximum\) \{.*?\n    \}\n''',
              '''    Optional<ItemId> equippedMainHandItemId(Player player) {\n        return selectedPhysicalItem(player)\n                .filter(selected -> selected.definition().weaponProfile().isPresent())\n                .map(selected -> selected.record().itemId());\n    }\n\n    Optional<CrossbowPersistentState> equippedCrossbowState(Player player) {\n        return selectedPhysicalItem(player)\n                .filter(selected -> selected.definition().weaponProfile().isPresent())\n                .map(selected -> selected.record().payloadJson())\n                .map(CrossbowPayloadCodec::decode);\n    }\n\n    Optional<CatalystDurability> equippedCatalystDurability(Player player, int baseMaximum) {\n        return selectedPhysicalItem(player)\n                .filter(selected -> selected.definition().weaponProfile().isPresent())\n                .map(selected -> selected.record().payloadJson())\n                .map(payload -> CatalystPayloadCodec.decode(payload, baseMaximum));\n    }\n''',
              'selected physical durable state')
          path.write_text(text)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionService.java')
          text = path.read_text()
          text = text.replace('equippedMainHand(session, crossbowItemId)', 'physicalInventoryItem(session, crossbowItemId)')
          text = text.replace('equippedMainHand(session, catalystItemId)', 'physicalInventoryItem(session, catalystItemId)')
          text = text.replace('same authoritative main-hand item', 'same authoritative physical inventory item')
          text = text.replace('same authoritative main-hand catalyst', 'same authoritative physical inventory catalyst')
          text = regex_once(
              text,
              r'''    private static ItemLocationRecord equippedMainHand\(\n            LoadedCharacterSession session, ItemId expectedItemId\) \{.*?\n    \}\n\n    private static Set<KnowledgeKey> learnedKnowledge''',
              '''    private static ItemLocationRecord physicalInventoryItem(\n            LoadedCharacterSession session, ItemId expectedItemId) {\n        ItemLocationRecord item =\n                session.snapshot().itemRecords().stream()\n                        .filter(record -> record.itemId().equals(expectedItemId))\n                        .findFirst()\n                        .orElse(null);\n        if (item == null\n                || item.ownerCharacterId().filter(session.characterId()::equals).isEmpty()\n                || item.location().type()\n                        != com.branz.mmorpg.persistence.transaction.ValueLocationType\n                                .CHARACTER_INVENTORY) {\n            return null;\n        }\n        int slot;\n        try {\n            slot = inventorySlot(item.location());\n        } catch (IllegalArgumentException exception) {\n            return null;\n        }\n        return slot >= 0 && slot < 36 && slot != ChronicleService.HOTBAR_SLOT ? item : null;\n    }\n\n    private static Set<KnowledgeKey> learnedKnowledge''',
              'physical durable helper')
          path.write_text(text)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java')
          text = path.read_text()
          text = regex_once(
              text,
              r'''    private SelectedHotbarSlot selectedSlot\(Player player, int slot\) \{.*?\n    \}\n\n    private Optional<String> equippedWeaponFamily''',
              '''    private SelectedHotbarSlot selectedSlot(Player player, int slot) {\n        if (slot == ChronicleService.HOTBAR_SLOT) {\n            return new SelectedHotbarSlot(slot, SelectedSlotKind.CHRONICLE);\n        }\n        ResolvedPhysicalItem selected = characters.physicalItemAt(player, slot).orElse(null);\n        return selected != null && selected.definition().weaponProfile().isPresent()\n                ? SelectedHotbarSlot.combatWeapon(slot)\n                : new SelectedHotbarSlot(slot, SelectedSlotKind.TOOL_OR_BLOCK);\n    }\n\n    private Optional<String> equippedWeaponFamily''',
              'selected hotbar weapon classification')
          text = regex_once(
              text,
              r'''    private Optional<ItemDefinition> equippedDefinition\(Player player, EquipmentSlot slot\) \{.*?\n    \}\n\n    private Optional<String> combatReadinessFailure''',
              '''    private Optional<ItemDefinition> equippedDefinition(Player player, EquipmentSlot slot) {\n        if (slot == EquipmentSlot.MAIN_HAND) {\n            return characters.selectedPhysicalItem(player)\n                    .map(ResolvedPhysicalItem::definition)\n                    .filter(definition -> definition.weaponProfile().isPresent());\n        }\n        return characters\n                .active(player)\n                .flatMap(\n                        session ->\n                                session.snapshot()\n                                        .equipment()\n                                        .item(slot)\n                                        .flatMap(\n                                                itemId ->\n                                                        session.snapshot().itemRecords().stream()\n                                                                .filter(\n                                                                        record ->\n                                                                                record.itemId()\n                                                                                        .equals(\n                                                                                                itemId))\n                                                                .findFirst()\n                                                                .flatMap(\n                                                                        record ->\n                                                                                items.find(\n                                                                                        record\n                                                                                                .definitionId()))));\n    }\n\n    private Optional<String> combatReadinessFailure''',
              'physical main definition')
          text = regex_once(
              text,
              r'''    private Optional<String> combatReadinessFailure\(Player player\) \{.*?\n    \}\n\n    private Optional<String> guardReadinessFailure''',
              '''    private Optional<String> combatReadinessFailure(Player player) {\n        if (characters.valueMutationInFlight(player)) {\n            return Optional.of("Combat not ready: inventory state is changing.");\n        }\n        ResolvedPhysicalItem selected = characters.selectedPhysicalItem(player).orElse(null);\n        ItemDefinition main = selected == null ? null : selected.definition();\n        if (main == null || main.weaponProfile().isEmpty()) {\n            return Optional.empty();\n        }\n        Result<WeaponLoadoutResolution, WeaponLoadoutErrorCode> resolved =\n                WeaponLoadoutPolicy.resolve(\n                        main, equippedDefinition(player, EquipmentSlot.OFF_HAND));\n        if (resolved\n                instanceof\n                Result.Failure<WeaponLoadoutResolution, WeaponLoadoutErrorCode> failure) {\n            return Optional.of("Combat not ready: " + failure.detail());\n        }\n        String family =\n                ((Result.Success<WeaponLoadoutResolution, WeaponLoadoutErrorCode>) resolved)\n                        .value()\n                        .weapon()\n                        .family();\n        LoadedCharacterSession character = characters.active(player).orElse(null);\n        if (character == null) {\n            return Optional.of("Combat not ready: character build is unavailable.");\n        }\n        Optional<String> durabilityFailure =\n                WeaponCombatReadiness.durabilityFailure(main, selected.record().payloadJson());\n        if (durabilityFailure.isPresent()) {\n            return durabilityFailure;\n        }\n        Result<BuildResolution, BuildErrorCode> build =\n                builds.resolve(character.snapshot().build(), family, learnedKnowledge(character));\n        return build instanceof Result.Failure<BuildResolution, BuildErrorCode> failure\n                ? Optional.of("Combat not ready: " + failure.detail())\n                : Optional.empty();\n    }\n\n    private Optional<String> guardReadinessFailure''',
              'physical combat readiness')
          path.write_text(text)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java')
          text = path.read_text()
          text = replace_once(
              text,
              '''                new WeaponDurabilityController(\n                        this,\n                        characterSessionController,\n                        activeItemEngine.get(),\n                        activeMoveEngine.get(),\n''',
              '''                new WeaponDurabilityController(\n                        this,\n                        characterSessionController,\n                        activeMoveEngine.get(),\n''',
              'durability controller constructor')
          path.write_text(text)
          PY
          ./gradlew :mmo-bootstrap:spotlessApply
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-physical-combat-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionService.java mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java .github/workflows/apply-physical-combat-authority.yml
          git commit -m "Route combat through selected physical weapon authority"
          git push origin HEAD:agent/physical-melee-weapon-bridge
