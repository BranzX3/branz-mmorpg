name: migrate-crossbow-binding-persistence-test
on:
  push:
    branches: [agent/physical-melee-weapon-bridge]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-melee-weapon-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Migrate persistence test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mmo-persistence/src/test/java/com/branz/mmorpg/persistence/transaction/JdbcValueTransactionServiceIntegrationTest.java')
          text = path.read_text()
          old = '''        ValueLocation mainHand = ValueLocation.nativeEquipped("MAIN_HAND");
        ValueLocation quiver = ValueLocation.quiver(quiverId);
        grantItem(crossbowId, mainHand);
        grantLot(boltLotId, quiver, 2);
'''
          new = '''        ValueLocation physicalCrossbow = ValueLocation.inventory("slot:3");
        ValueLocation quiver = ValueLocation.quiver(quiverId);
        grantItem(crossbowId, physicalCrossbow);
        grantLot(boltLotId, quiver, 2);
'''
          if text.count(old) != 1:
              raise SystemExit(f'crossbow fixture expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_update = '''                                Optional.of(CHARACTER),
                                mainHand,
                                "{}",
                                placedPayload),
'''
          new_update = '''                                Optional.of(CHARACTER),
                                physicalCrossbow,
                                "{}",
                                placedPayload),
'''
          # Scope through first occurrence after this test's method marker.
          marker = 'void crossbowBoltBindingCommitsItemCheckpointAndQuiverConsumptionExactlyOnce()'
          before, after = text.split(marker, 1)
          if after.count(old_update) < 1:
              raise SystemExit('crossbow payload update location block not found')
          after = after.replace(old_update, new_update, 1)
          text = before + marker + after
          needle = '''        assertTrue(crossbow.payloadJson().contains("BOLT_PLACED"));
        assertEquals(2, crossbow.version());
'''
          replacement = '''        assertTrue(crossbow.payloadJson().contains("BOLT_PLACED"));
        assertEquals(physicalCrossbow, crossbow.location());
        assertEquals(2, crossbow.version());
'''
          if text.count(needle) != 1:
              raise SystemExit('crossbow result assertion block not found exactly once')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          ./gradlew :mmo-persistence:spotlessApply
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/migrate-crossbow-binding-persistence-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mmo-persistence/src/test/java/com/branz/mmorpg/persistence/transaction/JdbcValueTransactionServiceIntegrationTest.java .github/workflows/migrate-crossbow-binding-persistence-test.yml
          git commit -m "Test Crossbow binding from physical inventory"
          git push origin HEAD:agent/physical-melee-weapon-bridge
