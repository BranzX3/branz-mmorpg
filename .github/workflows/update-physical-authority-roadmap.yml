name: update-physical-authority-roadmap
on:
  push:
    branches:
      - agent/physical-item-authority-acceptance
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-item-authority-acceptance
      - name: Update acceptance status and index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/39-implementation-roadmap.md')
          text = roadmap.read_text()
          old = "1. **Physical gameplay item authority refactor — `IN_PROGRESS`.** Replace the temporary\n   `MAIN_HAND`/Scene-deck interaction model with the authored physical model from ADR 0025: weapons\n   and consumables live in hotbar 1–8, selected hotbar weapon drives combat authority, shield/armor\n   use native physical slots, Chronicle owns build/virtual/cosmetic state, and production world mobs\n   never use training-only hidden health. Migrate legacy main-hand locations idempotently while\n   preserving item UUID/payload/durability and reconnect/restart truth.\n"
          new = "1. **Physical gameplay item authority refactor — `AUTOMATED_VERIFIED`; live client pass pending.**\n   The temporary `MAIN_HAND`/Scene-deck authority is removed for the currently authored gameplay\n   content: weapons and whole consumable lots use physical inventory/hotbar truth, the selected\n   signed hotbar weapon drives combat, authored shields use transactional native `OFF_HAND`,\n   Chronicle cannot mutate native weapon/shield/armor slots, legacy MAIN_HAND migrates before Player\n   Session readiness, and ordinary world mobs use canonical entity health. CI covers idempotent\n   move/swap/wear, reconnect/restart and selected-slot authority. Active content has no authored MMO\n   armor profile/item, so HEAD/CHEST/LEGS/FEET remain deliberately fail-closed rather than inferred\n   from Bukkit Material. The required real Paper client A–F pass is recorded in\n   `44-physical-gameplay-item-acceptance.md`; per `42-ai-coding-handoff.md`, feature 2 remains blocked\n   until that live pass succeeds.\n"
          if text.count(old) != 1:
              raise SystemExit(f'roadmap queue block expected once, found {text.count(old)}')
          roadmap.write_text(text.replace(old, new, 1))

          index = Path('docs/00-README.md')
          text = index.read_text()
          old = "| `43-content-authoring-tools.md` | Content CLI, in-game labs, simulations, authoring UX and PR previews |\n"
          new = old + "| `44-physical-gameplay-item-acceptance.md` | Physical hotbar/offhand/consumable authority live acceptance and evidence gate |\n"
          if text.count(old) != 1:
              raise SystemExit(f'document index row expected once, found {text.count(old)}')
          index.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/update-physical-authority-roadmap.yml
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mark physical item authority automated verified'
          git push origin HEAD:agent/physical-item-authority-acceptance
