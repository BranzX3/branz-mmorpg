name: wire-physical-lot-movement
on:
  push:
    branches:
      - agent/physical-lot-movement
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-lot-movement
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Wire full-lot movement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/PhysicalInventoryInteractionController.java')
          text = path.read_text()
          text = once(text, 'import com.branz.mmorpg.api.identity.ItemId;\n', 'import com.branz.mmorpg.api.identity.ItemId;\nimport com.branz.mmorpg.api.identity.LotId;\n', 'lot import')
          text = once(text, ' * Owns the first physical-inventory slice: moving/swapping durable unique MMO items within player\n * storage slots 0-35 while database placement remains authoritative.\n', ' * Owns physical inventory movement for durable unique items and whole stackable lots within player\n * storage slots 0-35 while database placement remains authoritative.\n')
          text = once(text, '    private final PhysicalInventoryItemMoveService moves;\n    private final String contentVersion;\n', '    private final PhysicalInventoryItemMoveService moves;\n    private final PhysicalInventoryLotMoveService lotMoves;\n    private final String contentVersion;\n', 'lot service field')
          text = once(text, '            BukkitItemProjectionCodec codec,\n            PhysicalInventoryItemMoveService moves,\n            String contentVersion) {\n', '            BukkitItemProjectionCodec codec,\n            PhysicalInventoryItemMoveService moves,\n            PhysicalInventoryLotMoveService lotMoves,\n            String contentVersion) {\n', 'constructor args')
          text = once(text, '        this.moves = Objects.requireNonNull(moves, "moves");\n        this.contentVersion = Objects.requireNonNull(contentVersion, "contentVersion");\n', '        this.moves = Objects.requireNonNull(moves, "moves");\n        this.lotMoves = Objects.requireNonNull(lotMoves, "lotMoves");\n        this.contentVersion = Objects.requireNonNull(contentVersion, "contentVersion");\n', 'constructor assign')
          old = '                            Result<LoadedCharacterSession, CharacterSessionErrorCode> result =\n                                    moves.moveUniqueItem(\n                                            interaction.session(),\n                                            new ItemId(intent.valueId()),\n                                            intent.sourceSlot(),\n                                            intent.destinationSlot(),\n                                            interaction.operationId(),\n                                            contentVersion);\n'
          new = '                            Result<LoadedCharacterSession, CharacterSessionErrorCode> result =\n                                    switch (intent.valueType()) {\n                                        case UNIQUE_ITEM ->\n                                                moves.moveUniqueItem(\n                                                        interaction.session(),\n                                                        new ItemId(intent.valueId()),\n                                                        intent.sourceSlot(),\n                                                        intent.destinationSlot(),\n                                                        interaction.operationId(),\n                                                        contentVersion);\n                                        case STACKABLE_LOT ->\n                                                lotMoves.moveFullLot(\n                                                        interaction.session(),\n                                                        new LotId(intent.valueId()),\n                                                        intent.sourceSlot(),\n                                                        intent.destinationSlot(),\n                                                        interaction.operationId(),\n                                                        contentVersion);\n                                    };\n'
          text = once(text, old, new, 'commit dispatch')
          path.write_text(text)

          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java')
          text = path.read_text()
          old = '                        new PhysicalInventoryItemMoveService(\n                                databaseRuntime, characterSessionService),\n                        snapshot.manifest().contentVersion());\n'
          new = '                        new PhysicalInventoryItemMoveService(\n                                databaseRuntime, characterSessionService),\n                        new PhysicalInventoryLotMoveService(\n                                databaseRuntime, characterSessionService),\n                        snapshot.manifest().contentVersion());\n'
          text = once(text, old, new, 'plugin lot service wiring')
          path.write_text(text)
          PY
          ./gradlew :mmo-items:spotlessApply :mmo-bootstrap:spotlessApply
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/wire-physical-lot-movement.yml
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Persist whole stackable lot inventory moves'
          git push origin HEAD:agent/physical-lot-movement
