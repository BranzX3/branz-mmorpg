name: defense-format

on:
  push:
    branches:
      - feature/playable-onboarding-defense-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Format defense acceptance probe
        run: ./gradlew :mmo-bootstrap:spotlessApply
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          path='mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/OnboardingClientAcceptanceProbe.java'
          if git diff --quiet -- "$path"; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Format defense onboarding acceptance'
          git push origin HEAD:feature/playable-onboarding-defense-v1
