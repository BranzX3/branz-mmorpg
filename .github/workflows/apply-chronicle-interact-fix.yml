name: apply-chronicle-interact-fix

on:
  push:
    branches: [feature/playable-onboarding-chronicle-scene-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply minimal production fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/SceneHubController.java")
          text = path.read_text(encoding="utf-8")
          old = """    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)\n    public void onChronicleUse(PlayerInteractEvent event) {\n"""
          new = """    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = false)\n    public void onChronicleUse(PlayerInteractEvent event) {\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Chronicle handler annotation, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/SceneHubController.java

      - name: Compile production fix
        run: bash ./gradlew :mmo-bootstrap:compileJava --no-daemon --console=plain

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-chronicle-interact-fix.yml
          test "$(git diff --name-only | sort)" = "mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/SceneHubController.java"
          test "$(git diff --cached --name-only)" = ".github/workflows/apply-chronicle-interact-fix.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/SceneHubController.java
          git commit -m "fix(scene): accept pre-cancelled Chronicle RMB"
          git push origin HEAD:feature/playable-onboarding-chronicle-scene-v1
