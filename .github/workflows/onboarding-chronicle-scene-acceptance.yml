name: retire-onboarding-chronicle-scene-acceptance

on:
  push:
    branches: [feature/playable-onboarding-chronicle-scene-v1]

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify candidate before cleanup
        run: bash ./gradlew :mmo-bootstrap:compileJava --no-daemon --console=plain

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/onboarding-chronicle-scene-acceptance.yml
          git diff --check
          test "$(git diff --cached --name-only)" = ".github/workflows/onboarding-chronicle-scene-acceptance.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(onboarding): remove temporary Chronicle Scene gate"
          git push origin HEAD:feature/playable-onboarding-chronicle-scene-v1
