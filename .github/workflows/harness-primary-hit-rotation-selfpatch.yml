name: harness-primary-hit-rotation-selfpatch

on:
  push:
    branches:
      - harness-feature/physical-primary-hit-v1
    paths:
      - '.github/workflows/harness-primary-hit-rotation-selfpatch.yml'
      - '.mmorpg-harness/patch_primary_hit_rotation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harness-feature/physical-primary-hit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded rotation patch
        run: python .mmorpg-harness/patch_primary_hit_rotation.py
      - name: Validate harness protocol
        run: |
          python -m py_compile .mmorpg-harness/runner.py .mmorpg-harness/selftest.py
          python .mmorpg-harness/selftest.py
      - name: Commit reviewed output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .mmorpg-harness/runner.py
          git diff --cached --quiet && exit 1
          git commit -m 'Harness: preserve player position during B4 rotation staging'
          git push origin HEAD:harness-feature/physical-primary-hit-v1
