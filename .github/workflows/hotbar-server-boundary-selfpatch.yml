name: hotbar-server-boundary-selfpatch

on:
  push:
    branches:
      - diagnostic/physical-hotbar-server-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply diagnostic patch
        run: python .mmorpg-harness/tmp_hotbar_server_boundary_patch.py
      - name: Format and compile
        run: |
          ./gradlew --no-daemon --console=plain spotlessApply :mmo-bootstrap:compileJava
      - name: Commit bounded diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/PhysicalInventoryInteractionController.java
          git diff --cached --quiet && exit 0
          git commit -m "diagnostic: trace physical hotbar server boundary"
          git push origin HEAD:diagnostic/physical-hotbar-server-boundary
