name: harness-client-compile-capability-selfpatch

on:
  push:
    branches:
      - harness-fix/physical-client-acceptance-compile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch reviewed capability from exact anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('.mmorpg-harness/runner.py')
          text = runner.read_text(encoding='utf-8')
          insertion_anchor = '''def gradle_wrapper(repo: Path) -> str:\n    p = repo / ("gradlew.bat" if os.name == "nt" else "gradlew")\n    if not p.is_file():\n        raise HarnessError("GRADLE_WRAPPER_MISSING", str(p))\n    return str(p)\n\n\nActionHandler = Callable[[Path, Path, dict[str, Any]], tuple[int, str, str, dict[str, Any]]]\n'''
          insertion = '''def gradle_wrapper(repo: Path) -> str:\n    p = repo / ("gradlew.bat" if os.name == "nt" else "gradlew")\n    if not p.is_file():\n        raise HarnessError("GRADLE_WRAPPER_MISSING", str(p))\n    return str(p)\n\n\ndef action_client_acceptance_compile(\n    repo: Path, result_dir: Path, manifest: dict[str, Any]\n) -> tuple[int, str, str, dict[str, Any]]:\n    client_dir = repo / "acceptance" / "physical-client-26.2"\n    wrapper = client_dir / ("gradlew.bat" if os.name == "nt" else "gradlew")\n    required = (\n        client_dir / "settings.gradle",\n        client_dir / "build.gradle",\n        client_dir / "gradle.properties",\n        client_dir / "gradle" / "wrapper" / "gradle-wrapper.properties",\n        client_dir / "gradle" / "wrapper" / "gradle-wrapper.jar",\n        wrapper,\n    )\n    missing = [str(path.relative_to(repo)) for path in required if not path.is_file()]\n    if missing:\n        raise HarnessError("CLIENT_ACCEPTANCE_PROJECT_MISSING", json.dumps(missing))\n\n    env = gradle_env(repo)\n    env["GRADLE_USER_HOME"] = str((repo.parent / "gradle-home-client").resolve())\n    argv = [str(wrapper), "--no-daemon", "--console=plain", "build"]\n    started = time.monotonic()\n    cp = run_action(argv, cwd=client_dir, timeout=1800, env=env)\n    elapsed = round(time.monotonic() - started, 3)\n    return cp.returncode, cp.stdout, cp.stderr, {\n        "action_status": "PASS" if cp.returncode == 0 else "FAIL",\n        "fixed_command_id": "PHYSICAL_CLIENT_ACCEPTANCE_COMPILE",\n        "argv": argv,\n        "working_directory": client_dir.relative_to(repo).as_posix(),\n        "client_wrapper_sha256": sha256_file(wrapper),\n        "client_wrapper_properties_sha256": sha256_file(\n            client_dir / "gradle" / "wrapper" / "gradle-wrapper.properties"\n        ),\n        "exit_code": cp.returncode,\n        "duration_seconds": elapsed,\n    }\n\n\nActionHandler = Callable[[Path, Path, dict[str, Any]], tuple[int, str, str, dict[str, Any]]]\n'''
          if text.count(insertion_anchor) != 1:
              raise SystemExit('runner insertion anchor mismatch')
          text = text.replace(insertion_anchor, insertion, 1)

          spec_anchor = '''    "MMO_CONTENT_VALIDATE_FIXTURE_V1": ActionSpec(action_content_validate_fixture, "CONTENT_VALIDATE_MILESTONE1"),\n}\n'''
          spec_replacement = '''    "MMO_CONTENT_VALIDATE_FIXTURE_V1": ActionSpec(action_content_validate_fixture, "CONTENT_VALIDATE_MILESTONE1"),\n    "MMO_CLIENT_ACCEPTANCE_COMPILE_V1": ActionSpec(\n        action_client_acceptance_compile, "PHYSICAL_CLIENT_ACCEPTANCE_COMPILE"\n    ),\n}\n'''
          if text.count(spec_anchor) != 1:
              raise SystemExit('runner action-spec anchor mismatch')
          runner.write_text(text.replace(spec_anchor, spec_replacement, 1), encoding='utf-8')

          selftest = Path('.mmorpg-harness/selftest.py')
          tests = selftest.read_text(encoding='utf-8')
          test_anchor = '''    assert R.ACTION_SPECS["MMO_BOOTSTRAP_INVALID_CONTENT_SMOKE_V1"].identity == "BOOTSTRAP_INVALID_CONTENT_SMOKE"\n\n'''
          test_replacement = '''    assert R.ACTION_SPECS["MMO_BOOTSTRAP_INVALID_CONTENT_SMOKE_V1"].identity == "BOOTSTRAP_INVALID_CONTENT_SMOKE"\n    assert R.ACTION_SPECS["MMO_CLIENT_ACCEPTANCE_COMPILE_V1"].identity == "PHYSICAL_CLIENT_ACCEPTANCE_COMPILE"\n    assert R.ACTION_SPECS["MMO_CLIENT_ACCEPTANCE_COMPILE_V1"].handler is R.action_client_acceptance_compile\n\n'''
          if tests.count(test_anchor) != 1:
              raise SystemExit('selftest anchor mismatch')
          selftest.write_text(tests.replace(test_anchor, test_replacement, 1), encoding='utf-8')

          protocol = Path('.mmorpg-harness/PROTOCOL.md')
          doc = protocol.read_text(encoding='utf-8')
          allow_anchor = '''- `MMO_CONTENT_VALIDATE_FIXTURE_V1`\n\nThe deprecated combat-acceptance action'''
          allow_replacement = '''- `MMO_CONTENT_VALIDATE_FIXTURE_V1`\n- `MMO_CLIENT_ACCEPTANCE_COMPILE_V1` — compile the checked-in standalone Minecraft 26.2 Fabric Client GameTest project using its own pinned Gradle wrapper. No remote argv or environment overrides are accepted.\n\nThe deprecated combat-acceptance action'''
          if doc.count(allow_anchor) != 1:
              raise SystemExit('protocol allowlist anchor mismatch')
          doc = doc.replace(allow_anchor, allow_replacement, 1)
          assumption_anchor = '''Smoke actions never accept a remote content path or arbitrary Gradle arguments.\n'''
          assumption_replacement = '''Smoke actions never accept a remote content path or arbitrary Gradle arguments.\n\nThe client acceptance compile action is isolated from the production multi-project wrapper. It executes only `acceptance/physical-client-26.2/gradlew[.bat] --no-daemon --console=plain build` from that fixed directory and records the nested wrapper hashes in action metadata.\n'''
          if doc.count(assumption_anchor) != 1:
              raise SystemExit('protocol assumption anchor mismatch')
          protocol.write_text(doc.replace(assumption_anchor, assumption_replacement, 1), encoding='utf-8')
          PY
      - name: Run harness self-test
        shell: bash
        run: python .mmorpg-harness/selftest.py
      - name: Verify patch scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .mmorpg-harness/PROTOCOL.md .mmorpg-harness/runner.py .mmorpg-harness/selftest.py | sort)"
          test "$changed" = "$expected"
      - name: Commit patched harness through Git data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(api + path, data=data, method=method, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'branz-harness-capability-selfpatch',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          ref = request('GET', f'/repos/{repo}/git/ref/heads/{branch}')
          if ref['object']['sha'] != parent:
              raise SystemExit('feature branch moved during harness patch')
          commit = request('GET', f'/repos/{repo}/git/commits/{parent}')
          entries = []
          for path in (
              '.mmorpg-harness/runner.py',
              '.mmorpg-harness/selftest.py',
              '.mmorpg-harness/PROTOCOL.md',
          ):
              raw = pathlib.Path(path).read_bytes()
              blob = request('POST', f'/repos/{repo}/git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = request('POST', f'/repos/{repo}/git/trees', {
              'base_tree': commit['tree']['sha'],
              'tree': entries,
          })
          created = request('POST', f'/repos/{repo}/git/commits', {
              'message': 'harness: add physical client compile capability',
              'tree': tree['sha'],
              'parents': [parent],
          })
          request('PATCH', f'/repos/{repo}/git/refs/heads/{branch}', {
              'sha': created['sha'],
              'force': False,
          })
          print(f'HARNESS_PATCH_COMMIT={created["sha"]}')
          PY
