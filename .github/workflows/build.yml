name: build

on:
  push:
    branches: [feature/playable-onboarding-foundation-v1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playable-onboarding-foundation-v1
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup standalone Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Apply guarded real-client onboarding acceptance
        run: python3 .github/scripts/playable-onboarding-real-client-acceptance.py

      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply

      - name: Restore permanent CI and remove staging helper
        shell: bash
        run: |
          set -euo pipefail
          git show 6f363d4370ca63dc3420e248962cf6418b6c09b7:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f .github/scripts/playable-onboarding-real-client-acceptance.py
          git diff --check

      - name: Verify full repository
        run: bash ./gradlew clean build --no-daemon --console=plain

      - name: Compile exact 26.2 onboarding client gametest
        run: gradle -p acceptance/onboarding-client-26.2 compileGametestJava processGametestResources --no-daemon --console=plain

      - name: Run real Minecraft 26.2 onboarding acceptance
        shell: bash
        run: |
          set -uo pipefail
          rm -rf mmo-bootstrap/run
          mkdir -p mmo-bootstrap/run
          printf 'eula=true\n' > mmo-bootstrap/run/eula.txt
          cat > mmo-bootstrap/run/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          spawn-protection=0
          max-players=1
          EOF
          rm -f mmo-bootstrap/build/onboarding-client-acceptance.pass
          bash ./gradlew :mmo-bootstrap:runServer -PonboardingAcceptance=true --no-daemon --console=plain > onboarding-paper.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 180); do
            if grep -q 'Done (' onboarding-paper.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo 'Paper did not become ready.'
            cat onboarding-paper.log || true
            wait "$SERVER_PID" || true
            exit 1
          fi

          set +e
          xvfb-run -a gradle -p acceptance/onboarding-client-26.2 runClientGameTest --no-daemon --console=plain > onboarding-client.log 2>&1
          CLIENT_RC=$?
          set -e

          for _ in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          SERVER_RC=0
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo 'Paper did not shut down after onboarding acceptance; terminating failed run.'
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" || true
            SERVER_RC=1
          else
            wait "$SERVER_PID" || SERVER_RC=$?
          fi

          echo '===== CLIENT LOG ====='
          cat onboarding-client.log || true
          echo '===== PAPER LOG ====='
          cat onboarding-paper.log || true

          test "$CLIENT_RC" -eq 0
          test "$SERVER_RC" -eq 0
          test -f mmo-bootstrap/build/onboarding-client-acceptance.pass
          test "$(tr -d '\r\n' < mmo-bootstrap/build/onboarding-client-acceptance.pass)" = 'ONBOARDING_CLIENT_ACCEPTANCE_PASS'
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_FIRST_READY' onboarding-paper.log
          grep -q 'ONBOARDING_CLIENT_ACCEPTANCE_PASS' onboarding-paper.log

      - name: Commit verified real-client acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(onboarding): prove real client choice and reconnect'
          git push origin HEAD:feature/playable-onboarding-foundation-v1
