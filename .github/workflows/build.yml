name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Harness self-test
        shell: bash
        run: |
          if [[ -f .mmorpg-harness/selftest.py ]]; then
            python .mmorpg-harness/selftest.py
          fi
      - name: Verify
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build
