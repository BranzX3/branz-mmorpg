name: directional-buffer-stage

on:
  push:
    branches: [feature/playable-onboarding-directional-buffer-v1]

permissions:
  contents: write

jobs:
  stage-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply guarded controller patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/directional-buffer-stage.py
          python - <<'PY'
          from pathlib import Path
          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java')
          text = path.read_text(encoding='utf-8')
          old = '''new CombatInputRequest(\n                        0,\n                        plugin.getServer().getCurrentTick(),'''
          new = '''new CombatInputRequest(\n                        1,\n                        plugin.getServer().getCurrentTick(),'''
          if text.count(old) != 1:
              raise SystemExit(f'synthetic request sequence patch expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and verify
        run: |
          bash ./gradlew :mmo-bootstrap:spotlessApply :mmo-combat:spotlessApply --no-daemon --console=plain
          bash ./gradlew clean build --no-daemon --console=plain
      - name: Commit verified controller wiring
        shell: bash
        run: |
          set -euo pipefail
          path='mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Wire directional primary and authored one-slot buffer'
          git push origin HEAD:feature/playable-onboarding-directional-buffer-v1
