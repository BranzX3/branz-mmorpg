name: apply-broken-weapon-readiness

on:
  push:
    branches:
      - agent/broken-weapon-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/broken-weapon-readiness
      - name: Apply readiness wiring
        shell: bash
        run: |
          python .github/apply-broken-weapon-readiness.py
          rm .github/apply-broken-weapon-readiness.py
          rm .github/workflows/apply-broken-weapon-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java .github/apply-broken-weapon-readiness.py .github/workflows/apply-broken-weapon-readiness.yml
          git commit -m "Wire broken weapon durability into combat readiness"
          git push origin HEAD:agent/broken-weapon-readiness
