name: playable-v1 combat patch v4

on:
  push:
    branches: [playable-v1]
    paths:
      - '.github/workflows/playable-v1-combat-patch-v4.yml'

permissions:
  contents: write

jobs:
  patch-format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playable-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Reuse verified whitespace-exact patch script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/playable-v1-combat-patch-v3.yml').read_text(encoding='utf-8')
          marker = (
              '      - name: Apply whitespace-exact combat ingress patch\n'
              '        shell: bash\n'
              '        run: |\n'
          )
          if workflow.count(marker) != 1:
              raise SystemExit(f'v3 apply marker guard failed: {workflow.count(marker)}')
          start = workflow.index(marker) + len(marker)
          end_marker = '\n      - name: Verify full repository'
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply-combat-v3.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-combat-v3.sh
          rm -f .github/workflows/playable-v1-combat-patch-v4.yml

      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply

      - name: Verify formatted diff
        run: git diff --check

      - name: Verify full repository
        run: bash ./gradlew clean build

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(combat): route primary attacks through MMO ingress'
          git push origin HEAD:playable-v1
