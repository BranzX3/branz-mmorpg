type: cutscene
id: branz:seal_opening
version: 1
scope: private
skip_policy: always
disconnect_recovery: apply_skip_state
setup:
  - id: setup_freeze
    at_ms: 0
    priority: 0
    track: player
    action_type: freeze_input
    values: {enabled: "true"}
  - id: setup_invulnerable
    at_ms: 0
    priority: 1
    track: player
    action_type: invulnerability
    values: {enabled: "true"}
timeline:
  - id: camera_gate
    at_ms: 0
    priority: 0
    track: camera
    action_type: camera_cut
    values: {path: "old_ruins_gate"}
  - id: seal_sound
    at_ms: 500
    priority: 0
    track: world
    action_type: sound
    values: {sound: "block_beacon_activate"}
  - id: warning_subtitle
    at_ms: 1000
    priority: 0
    track: actor
    action_type: actor_speak
    values: {text: "cutscene.seal.warning"}
checkpoints_ms: [0, 1000]
final_state:
  - id: final_signal
    at_ms: 0
    priority: 0
    track: player
    action_type: objective_signal
    values: {signal: "seal_opening_complete"}
skip_state:
  - id: skip_signal
    at_ms: 0
    priority: 0
    track: player
    action_type: objective_signal
    values: {signal: "seal_opening_complete"}
cleanup:
  - id: cleanup_camera
    at_ms: 0
    priority: 0
    track: camera
    action_type: camera_restore
  - id: cleanup_freeze
    at_ms: 0
    priority: 1
    track: player
    action_type: freeze_input
    values: {enabled: "false"}
  - id: cleanup_invulnerable
    at_ms: 0
    priority: 2
    track: player
    action_type: invulnerability
    values: {enabled: "false"}
