name: harness-client-join-signal-selfpatch

on:
  push:
    branches:
      - harness-fix/physical-client-join-signal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Gate staging on completed player join
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('.mmorpg-harness/runner.py')
          text = runner.read_text(encoding='utf-8')
          old = '''                    match = re.search(
                        r"UUID of player ([A-Za-z0-9_]{1,16}) is", paper_text
                    )
                    if match is None:
                        match = re.search(
                            r"([A-Za-z0-9_]{1,16}) joined the game", paper_text
                        )
'''
          new = '''                    match = re.search(
                        r"([A-Za-z0-9_]{1,16}) joined the game", paper_text
                    )
'''
          if text.count(old) != 1:
              raise SystemExit(f'join signal anchor count={text.count(old)}')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate harness
        shell: bash
        run: |
          python -m py_compile .mmorpg-harness/runner.py .mmorpg-harness/selftest.py
          python .mmorpg-harness/selftest.py
      - name: Commit runner patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .mmorpg-harness/runner.py
          test "$(git diff --cached --name-only)" = '.mmorpg-harness/runner.py'
          git commit -m 'harness: stage ingress handshake only after player join'
          git push origin HEAD:${GITHUB_REF_NAME}
