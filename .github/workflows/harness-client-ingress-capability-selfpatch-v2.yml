name: harness-client-ingress-capability-selfpatch-v2

on:
  push:
    branches:
      - harness-fix/physical-client-ingress-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch runner and protocol
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('.mmorpg-harness/runner.py')
          text = runner.read_text(encoding='utf-8')
          fragment = Path('.mmorpg-harness/physical_client_ingress_action.fragment').read_text(encoding='utf-8').rstrip() + '\n'
          anchor = '\n\nActionHandler = Callable[[Path, Path, dict[str, Any]], tuple[int, str, str, dict[str, Any]]]\n'
          if text.count(anchor) != 1:
              raise SystemExit('runner action anchor mismatch')
          text = text.replace(anchor, '\n\n' + fragment + anchor, 1)
          spec_anchor = '    "MMO_CLIENT_ACCEPTANCE_COMPILE_V1": ActionSpec(\n        action_client_acceptance_compile, "PHYSICAL_CLIENT_ACCEPTANCE_COMPILE"\n    ),\n}\n'
          spec_replacement = '    "MMO_CLIENT_ACCEPTANCE_COMPILE_V1": ActionSpec(\n        action_client_acceptance_compile, "PHYSICAL_CLIENT_ACCEPTANCE_COMPILE"\n    ),\n    "MMO_CLIENT_ACCEPTANCE_INGRESS_V1": ActionSpec(\n        action_client_acceptance_ingress, "PHYSICAL_CLIENT_ACCEPTANCE_INGRESS"\n    ),\n}\n'
          if text.count(spec_anchor) != 1:
              raise SystemExit('runner spec anchor mismatch')
          runner.write_text(text.replace(spec_anchor, spec_replacement, 1), encoding='utf-8')

          selftest = Path('.mmorpg-harness/selftest.py')
          tests = selftest.read_text(encoding='utf-8')
          test_anchor = '    assert R.ACTION_SPECS["MMO_CLIENT_ACCEPTANCE_COMPILE_V1"].handler is R.action_client_acceptance_compile\n\n'
          test_replacement = test_anchor.rstrip('\n') + '\n    assert R.ACTION_SPECS["MMO_CLIENT_ACCEPTANCE_INGRESS_V1"].identity == "PHYSICAL_CLIENT_ACCEPTANCE_INGRESS"\n    assert R.ACTION_SPECS["MMO_CLIENT_ACCEPTANCE_INGRESS_V1"].handler is R.action_client_acceptance_ingress\n\n'
          if tests.count(test_anchor) != 1:
              raise SystemExit('selftest anchor mismatch')
          selftest.write_text(tests.replace(test_anchor, test_replacement, 1), encoding='utf-8')

          protocol = Path('.mmorpg-harness/PROTOCOL.md')
          doc = protocol.read_text(encoding='utf-8')
          allow_anchor = '- `MMO_CLIENT_ACCEPTANCE_COMPILE_V1` — compile the checked-in standalone Minecraft 26.2 Fabric Client GameTest project using its own pinned Gradle wrapper. No remote argv or environment overrides are accepted.\n'
          allow_replacement = allow_anchor + '- `MMO_CLIENT_ACCEPTANCE_INGRESS_V1` — run a fresh offline local Paper 26.2 server and the checked-in Fabric Client GameTest with fixed commands; OP and XP-level 7 are console-only acceptance staging, `/mmo physical status` is typed through real client chat input, and Paper/client logs are retained as evidence.\n'
          if doc.count(allow_anchor) != 1:
              raise SystemExit('protocol anchor mismatch')
          protocol.write_text(doc.replace(allow_anchor, allow_replacement, 1), encoding='utf-8')
          PY
      - name: Compile patched runner
        run: python -m py_compile .mmorpg-harness/runner.py .mmorpg-harness/selftest.py
      - name: Run harness self-test
        run: python .mmorpg-harness/selftest.py
      - name: Commit exact harness files through Git data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']; branch=os.environ['GITHUB_REF_NAME']; token=os.environ['GH_TOKEN']; api='https://api.github.com'
          def req(method,path,body=None):
              r=urllib.request.Request(api+path,data=None if body is None else json.dumps(body).encode(),method=method,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'branz-harness-ingress-v2'})
              with urllib.request.urlopen(r) as response: return json.load(response)
          if req('GET',f'/repos/{repo}/git/ref/heads/{branch}')['object']['sha'] != parent: raise SystemExit('branch moved')
          commit=req('GET',f'/repos/{repo}/git/commits/{parent}'); entries=[]
          for path in ('.mmorpg-harness/runner.py','.mmorpg-harness/selftest.py','.mmorpg-harness/PROTOCOL.md'):
              raw=pathlib.Path(path).read_bytes(); blob=req('POST',f'/repos/{repo}/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'}); entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=req('POST',f'/repos/{repo}/git/trees',{'base_tree':commit['tree']['sha'],'tree':entries}); created=req('POST',f'/repos/{repo}/git/commits',{'message':'harness: add physical client ingress capability','tree':tree['sha'],'parents':[parent]}); req('PATCH',f'/repos/{repo}/git/refs/heads/{branch}',{'sha':created['sha'],'force':False}); print(created['sha'])
          PY
