name: apply-shield-formatting

on:
  push:
    branches:
      - agent/shield-durability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shield-durability
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply Spotless
        run: ./gradlew spotlessApply
      - name: Commit formatted sources
        run: |
          rm .github/workflows/apply-shield-formatting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format shield durability foundation"
          git push origin HEAD:agent/shield-durability
