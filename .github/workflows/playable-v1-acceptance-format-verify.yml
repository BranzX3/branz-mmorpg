name: playable-v1 acceptance format verify

on:
  push:
    branches: [playable-v1]
    paths:
      - '.github/workflows/playable-v1-acceptance-format-verify.yml'

permissions:
  contents: write

jobs:
  format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playable-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply repository formatting
        run: bash ./gradlew spotlessApply
      - name: Clean staging workflow
        shell: bash
        run: |
          rm -f .github/workflows/playable-v1-acceptance-format-verify.yml
          git diff --check
      - name: Verify full repository
        run: bash ./gradlew clean build
      - name: Commit verified acceptance test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'playable-v1-bot'
          git config user.email 'playable-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(combat): verify geometry-to-damage acceptance chain'
          git push origin HEAD:playable-v1
