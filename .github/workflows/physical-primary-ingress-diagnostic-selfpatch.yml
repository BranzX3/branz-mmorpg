name: physical-primary-ingress-diagnostic-selfpatch

on:
  push:
    branches:
      - acceptance/physical-primary-ingress-diagnostic-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Add acceptance-only primary ingress telemetry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java')
          text = path.read_text(encoding='utf-8')

          arm_anchor = '''    @EventHandler(priority = EventPriority.HIGHEST)
    public void onArmSwing(PlayerAnimationEvent event) {
        if (event.getAnimationType() != PlayerAnimationType.ARM_SWING) {
            return;
        }
'''
          arm_replacement = '''    @EventHandler(priority = EventPriority.MONITOR)
    public void onPhysicalPrimaryInteractObservation(PlayerInteractEvent event) {
        if (!Boolean.getBoolean("mmo.physical-primary-input-acceptance")) {
            return;
        }
        if (event.getHand() != org.bukkit.inventory.EquipmentSlot.HAND
                || (event.getAction() != Action.LEFT_CLICK_AIR
                        && event.getAction() != Action.LEFT_CLICK_BLOCK)) {
            return;
        }
        plugin.getLogger()
                .info(
                        "PHYSICAL_AUTHORITY_PRIMARY_INTERACT_SERVER player="
                                + event.getPlayer().getName()
                                + " action="
                                + event.getAction());
    }

    @EventHandler(priority = EventPriority.HIGHEST)
    public void onArmSwing(PlayerAnimationEvent event) {
        if (event.getAnimationType() != PlayerAnimationType.ARM_SWING) {
            return;
        }
        if (Boolean.getBoolean("mmo.physical-primary-input-acceptance")) {
            plugin.getLogger()
                    .info(
                            "PHYSICAL_AUTHORITY_ARM_SWING_SERVER player="
                                    + event.getPlayer().getName());
        }
'''
          if text.count(arm_anchor) != 1:
              raise SystemExit(f'arm anchor count={text.count(arm_anchor)}')
          text = text.replace(arm_anchor, arm_replacement, 1)

          session_anchor = '''        if (session == null || !characters.ready(event.getPlayer())) {
            return;
        }
        MoveDefinition primary = primaryMove(event.getPlayer()).orElse(null);
'''
          session_replacement = '''        if (session == null || !characters.ready(event.getPlayer())) {
            return;
        }
        if (Boolean.getBoolean("mmo.physical-primary-input-acceptance")) {
            plugin.getLogger()
                    .info(
                            "PHYSICAL_AUTHORITY_PRIMARY_SESSION_READY_SERVER player="
                                    + event.getPlayer().getName());
        }
        MoveDefinition primary = primaryMove(event.getPlayer()).orElse(null);
'''
          if text.count(session_anchor) != 1:
              raise SystemExit(f'session anchor count={text.count(session_anchor)}')
          text = text.replace(session_anchor, session_replacement, 1)

          move_anchor = '''        if (primary == null) {
            return;
        }
        SemanticInput intent =
'''
          move_replacement = '''        if (primary == null) {
            return;
        }
        if (Boolean.getBoolean("mmo.physical-primary-input-acceptance")) {
            plugin.getLogger()
                    .info(
                            "PHYSICAL_AUTHORITY_PRIMARY_MOVE_RESOLVED_SERVER player="
                                    + event.getPlayer().getName()
                                    + " move="
                                    + primary.id());
        }
        SemanticInput intent =
'''
          if text.count(move_anchor) != 1:
              raise SystemExit(f'move anchor count={text.count(move_anchor)}')
          path.write_text(text.replace(move_anchor, move_replacement, 1), encoding='utf-8')
          PY
      - name: Validate repository
        shell: bash
        run: ./gradlew clean build
      - name: Commit bounded telemetry
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java
          test "$(git diff --cached --name-only)" = 'mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CombatSessionController.java'
          git commit -m 'acceptance: trace physical primary ingress gates'
          git push origin HEAD:${GITHUB_REF_NAME}
