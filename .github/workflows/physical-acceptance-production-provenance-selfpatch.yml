name: physical-acceptance-production-provenance-selfpatch

on:
  push:
    branches:
      - fix/physical-acceptance-production-provenance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply acceptance staging fix
        run: python .mmorpg-harness/tmp_acceptance_production_provenance_patch.py
      - name: Format and validate
        run: |
          ./gradlew --no-daemon --console=plain spotlessApply clean build
      - name: Commit bounded staging fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionService.java
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/CharacterSessionController.java
          git add mmo-bootstrap/src/main/java/com/branz/mmorpg/bootstrap/BranzMmoPlugin.java
          git diff --cached --quiet && exit 0
          git commit -m "fix: stage physical acceptance as production projection"
          git push origin HEAD:fix/physical-acceptance-production-provenance
